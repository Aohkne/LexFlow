<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Duyệt cờ — ontology</title>
<style>
:root{--bg:#fff;--fg:#1c1917;--dim:#6b7280;--line:#e7e5e4;--panel:#fafaf9;
 --hit:#fde68a;--hitfg:#78350f;--ok:#047857;--okbg:#d1fae5;--bad:#b91c1c;--badbg:#fef2f2;
 --warn:#b45309;--warnbg:#fef3c7;}
@media(prefers-color-scheme:dark){:root{--bg:#1c1917;--fg:#e7e5e4;--dim:#a8a29e;--line:#44403c;
 --panel:#292524;--hit:#78350f;--hitfg:#fde68a;--okbg:#053c2e;--badbg:#2a1315;--warnbg:#4a3410;}}
*{box-sizing:border-box}
body{margin:0;font:14px/1.65 system-ui,"Segoe UI",sans-serif;background:var(--bg);color:var(--fg)}
header{position:sticky;top:0;z-index:9;background:var(--panel);border-bottom:1px solid var(--line);
 padding:10px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
h1{font-size:15px;margin:0}
.wrap{max-width:960px;margin:0 auto;padding:16px}
.card{border:1px solid var(--line);border-radius:9px;margin:14px 0;overflow:hidden}
.card.done{opacity:.5}
.chead{background:var(--panel);padding:9px 13px;border-bottom:1px solid var(--line);
 display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.tag{font-size:11px;font-weight:700;padding:2px 7px;border-radius:5px;background:var(--warnbg);
 color:var(--warn);text-transform:uppercase;letter-spacing:.03em}
.tag.t1{background:var(--badbg);color:var(--bad)}
code{background:var(--panel);padding:1px 5px;border-radius:4px;font-size:12.5px;
 font-family:ui-monospace,Consolas,monospace}
.cbody{padding:13px}
.row{display:grid;grid-template-columns:120px 1fr;gap:10px;margin:9px 0;align-items:start}
@media(max-width:640px){.row{grid-template-columns:1fr}}
.lbl{color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:.04em;padding-top:2px}
.quote{border-left:3px solid var(--line);padding-left:11px}
.law{background:var(--panel);border-radius:7px;padding:11px 13px;white-space:pre-wrap;
 max-height:230px;overflow:auto;font-size:13.5px}
mark{background:var(--hit);color:var(--hitfg);border-radius:3px;padding:1px 0}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px;align-items:center}
button{font:inherit;padding:6px 13px;border-radius:7px;border:1px solid var(--line);
 background:var(--bg);color:var(--fg);cursor:pointer}
button:hover{border-color:var(--dim)}
button.on[data-v="dung"]{background:var(--okbg);border-color:var(--ok);color:var(--ok);font-weight:600}
button.on[data-v="sai"]{background:var(--badbg);border-color:var(--bad);color:var(--bad);font-weight:600}
button.on[data-v="khong_chac"]{background:var(--warnbg);border-color:var(--warn);color:var(--warn);font-weight:600}
input.note{flex:1;min-width:170px;padding:6px 9px;border-radius:7px;border:1px solid var(--line);
 background:var(--bg);color:var(--fg)}
.amb{background:var(--badbg);border:1px solid var(--bad);border-radius:7px;padding:9px 12px;margin:9px 0;font-size:13px}
.muted{color:var(--dim);font-size:12.5px}
</style>
</head>
<body>
<header>
  <h1>Duyệt cờ</h1>
  <span id="prog" class="muted"></span>

  <span style="flex:1"></span>
  <label class="muted"><input type="checkbox" id="hideDone"> ẩn cờ đã quyết</label>
  <button id="save">Lưu</button>
  <button id="dl">Tải flag_verdicts.jsonl</button>
</header>

Nghị định số\n80/2016/NĐ-CP\nngày 01 tháng 7 năm 2016 của Chính phủ sửa đổi, bổ sung một số điều của Nghị định số\n101/2012/NĐ-CP\nngày 22 tháng 11 năm 2012 của Chính phủ về thanh toán không dùng tiền mặt và bãi bỏ\nĐiều 3\ncủa Nghị định số\n16/2019/NĐ-CP\nngày 01 tháng 02 năm 2019 của Chính phủ sửa đổi, bổ sung một số điều của các Nghị định quy định về điều kiện kinh doanh thuộc phạm vi quản lý nhà nước của Ngân hàng Nhà nước.", "span": [0, 556], "verdict": "", "note": ""}, {"key": "17/2024/TT-NHNN#than/dieu_16#khoan_2||điều kiện b: tiet_guard_thieu_gia_tri: 2 tiết mới phủ ('cá nhân' | 'tổ chức'), miền 'hinh_thuc_tai_khoan_thanh_toan' theo 17/2024/TT-NHNN#than/dieu_3#khoan_1 còn 'chung'. Phần bỏ sót là đúng chỗ 'và'/'hoặc' còn khác nhau — hỏi: trường hợp đó áp dụng gì?", "id": "17/2024/TT-NHNN#than/dieu_16#khoan_2", "type": "actor_cu", "tier": 2, "tier_name": "T2 · phép logic chưa xác định", "kind": "guard chưa phủ hết miền — hỏi phần bỏ sót", "warning": "tiet_guard_thieu_gia_tri: 2 tiết mới phủ ('cá nhân' | 'tổ chức'), miền 'hinh_thuc_tai_khoan_thanh_toan' theo 17/2024/TT-NHNN#than/dieu_3#khoan_1 còn 'chung'. Phần bỏ sót là đúng chỗ 'và'/'hoặc' còn khác nhau — hỏi: trường hợp đó áp dụng gì?", "field": "điều kiện b", "label": "Việc khách hàng chấp thuận với các nội dung tại thỏa thuận mở và sử dụng tài khoản thanh toán", "candidates": [], "dieu_title": "Điều 16. Mở tài khoản thanh toán bằng phương tiện điện tử", "khoan_text": "2. Ngân hàng, chi nhánh ngân hàng nước ngoài tự quyết định biện pháp, hình thức, công nghệ phục vụ việc mở tài khoản thanh toán bằng phương tiện điện tử, tự chịu rủi ro phát sinh (nếu có) và phải đáp ứng tối thiểu các yêu cầu sau:\na) Biện pháp, hình thức, công nghệ được ngân hàng, chi nhánh ngân hàng nước ngoài lựa chọn phải đảm bảo tiêu chuẩn về an ninh, an toàn, bảo mật theo quy định của Ngân hàng Nhà nước;\nb) Xác nhận việc khách hàng chấp thuận với các nội dung tại thỏa thuận mở và sử dụng tài khoản thanh toán:\n(i) Đối với tài khoản thanh toán của cá nhân: có biện pháp kỹ thuật sử dụng hình thức xác nhận bằng phương tiện điện từ để thể hiện sự chấp thuận của chủ tài khoản đối với các nội dung tại thỏa thuận mở và sử dụng tài khoản thanh toán;\n(ii) Đối với tài khoản thanh toán của tổ chức: người đại diện hợp pháp ký chữ ký điện tử để khẳng định sự chấp thuận của chủ tài khoản đối với các nội dung tại thỏa thuận mở và sử dụng tài khoản thanh toán;\nc) Lưu trữ, bảo quản đầy đủ, chi tiết đối với các tài liệu, thông tin, dữ liệu nhận biết khách hàng trong quá trình mở, sử dụng tài khoản thanh toán bằng phương tiện điện tử, như: thông tin nhận biết khách hàng; các yếu tố sinh trắc học của chủ tài khoản thanh toán cá nhân, người đại diện hợp pháp của tổ chức mở tài khoản thanh toán; âm thanh, hình ảnh, bản ghi hình, ghi âm; số điện thoại đăng ký giao dịch trên phần mềm ứng dụng giao dịch ngân hàng trên internet, điện thoại di động; thông tin định danh duy nhất của thiết bị giao dịch (địa chỉ MAC); nhật ký giao dịch; kết quả đối chiếu thông tin sinh trắc học theo quy định tại điểm b khoản 1 Điều này. Các thông tin, dữ liệu phải được lưu trữ an toàn, bảo mật, được sao lưu dự phòng, đảm bảo tính đầy đủ, toàn vẹn của dữ liệu để phục vụ cho công tác kiểm tra, đối chiếu, xác thực chủ tài khoản trong quá trình sử dụng tài khoản thanh toán, giải quyết tra soát, khiếu nại, tranh chấp và cung cấp thông tin khi có yêu cầu từ cơ quan có thẩm quyền. Thời gian thực hiện theo quy định của pháp luật về phòng, chống rửa tiền và giao dịch điện tử;\nd) Ngân hàng, chi nhánh ngân hàng nước ngoài phải thường xuyên kiểm tra, đánh giá mức độ an toàn, bảo mật của biện pháp, hình thức, công nghệ và thực hiện tạm dừng cung cấp dịch vụ để nâng cấp, chỉnh sửa, hoàn thiện trong trường hợp có dấu hiệu mất an toàn.", "span": [416, 518], "verdict": "", "note": ""}, {"key": "17/2024/TT-NHNN#than/dieu_16#khoan_2||điều kiện c.constraint_label: [cảnh báo] thêm dấu hiệu cho_phep: được", "id": "17/2024/TT-NHNN#than/dieu_16#khoan_2", "type": cho_phep: được", "field": "điều kiện b#2.object_label", "label": "Vốn điều lệ thực góp hoặc được cấp", "candidates": [], "dieu_title": "Điều 22. Các dịch vụ trung gian thanh toán và điều kiện cung ứng dịch vụ", "khoan_text": "2. Điều kiện cung ứng dịch vụ trung gian thanh toán:\nTổ chức không phải là ngân hàng, chi nhánh ngân hàng nước ngoài được Ngân hàng Nhà nước cấp Giấy phép hoạt động cung ứng dịch vụ trung gian thanh toán khi đáp ứng đầy đủ và phải đảm bảo duy trì đủ các điều kiện sau đây trong quá trình cung ứng dịch vụ trung gian thanh toán, cụ thể như sau:\na) Có giấy phép thành lập hoặc giấy chứng nhận đăng ký doanh nghiệp do cơ quan nhà nước có thẩm quyền cấp và không đang trong quá trình chia, tách, hợp nhất, sáp nhập, chuyển đổi, giải thể, phá sản theo quyết định đã được ban hành trong quá trình đề nghị cấp Giấy phép hoạt động cung ứng dịch vụ trung gian thanh toán; trường hợp cung ứng dịch vụ chuyển mạch tài chính, dịch vụ bù trừ điện tử, tổ chức phải đảm bảo không kinh doanh ngành nghề khác ngoài hoạt động cung ứng dịch vụ trung gian thanh toán;\nb) Có vốn điều lệ thực góp hoặc được cấp tối thiểu: 50 tỷ đồng đối với dịch vụ ví điện tử, dịch vụ hỗ trợ thu hộ, chi hộ và dịch vụ cổng thanh toán điện tử; 300 tỷ đồng đối với dịch vụ chuyển mạch tài chính, dịch vụ chuyển mạch tài chính quốc tế, dịch vụ bù trừ điện tử; chịu hoàn toàn trách nhiệm về tính hợp pháp của nguồn vốn đã góp hoặc vốn được cấp;\nc) Có Đề án cung ứng dịch vụ trung gian thanh toán được cấp có thẩm quyền theo quy định tại Điều lệ của tổ chức phê duyệt theo\nMẫu số 08 ban hành kèm theo Nghị định này;\nd) Điều kiện về nhân sự: Người đại diện theo pháp luật, Tổng Giám đốc (Giám đốc) của tổ chức phải có bằng đại học trở lên về một trong các ngành kinh tế, quản trị kinh doanh, luật, công nghệ thông tin và có ít nhất 05 năm kinh nghiệm là người quản lý, người điều hành của tổ chức trong lĩnh vực tài chính, ngân hàng và không thuộc những đối tượng bị cấm theo quy định của pháp luật; phải bảo đảm luôn có ít nhất một người đại diện theo pháp luật cư trú tại Việt Nam (Khi chỉ còn lại một người đại diện theo pháp luật cư trú tại Việt Nam thì người này khi xuất cảnh khỏi Việt Nam phải ủy quyền bằng văn bản cho cá nhân khác cư trú tại Việt Nam thực hiện quyền và nghĩa vụ của người đại diện theo pháp luật. Trường hợp này, người đại diện theo pháp luật vẫn phải chịu trách nhiệm về việc thực hiện quyền và nghĩa vụ đã ủy quyền).\nPhó Tổng Giám đốc (Phó Giám đốc) và các cán bộ chủ chốt thực hiện Đề án cung ứng dịch vụ trung gian thanh toán (gồm Trưởng phòng (ban) hoặc tương đương và các cán bộ kỹ thuật) có bằng cao đẳng trở lên về một trong các ngành kinh tế, quản trị kinh doanh, luật, công nghệ thông tin hoặc lĩnh vực chuyên môn đảm nhiệm;\nđ) Có Bản thuyết minh giải pháp kỹ thuật phục vụ cho hoạt động cung ứng dịch vụ trung gian thanh toán đề nghị cấp Giấy phép được cấp có thẩm quyền theo quy định tại Điều lệ của tổ chức phê duyệt đáp ứng yêu cầu đảm bảo an toàn hệ thống thông tin cấp độ 3 theo quy định của pháp luật;\ne) Đối với dịch vụ ví điện tử và dịch vụ hỗ trợ thu hộ, chi hộ cho các khách hàng có tài khoản tại nhiều ngân hàng, chi nhánh ngân hàng nước ngoài, tổ chức cung ứng dịch vụ phải được một tổ chức cung ứng dịch vụ chuyển mạch tài chính và dịch vụ bù trừ điện tử được Ngân hàng Nhà nước cấp phép để thực hiện chuyển mạch giao dịch tài chính và xử lý bù trừ các nghĩa vụ phát sinh trong quá trình cung ứng dịch vụ trung gian thanh toán của tổ chức;\ng) Đối với dịch vụ chuyển mạch tài chính, dịch vụ bù trừ điện tử, ngoài các điều kiện quy định tại điểm a, điểm b, điểm c, điểm d và điểm đ khoản 2 Điều này, tổ chức cung ứng dịch vụ phải: được một tổ chức thực hiện quyết toán kết quả bù trừ giữa các bên liên quan; có thỏa thuận kết nối với ít nhất 50 ngân hàng, chi nhánh ngân hàng nước ngoài có tổng vốn điều lệ trong năm liền kề trước năm nộp hồ sơ đề nghị cấp Giấy phép chiếm trên 65% tổng vốn điều lệ của các ngân hàng, chi nhánh ngân hàng nước ngoài trong hệ thống các tổ chức tín dụng và ít nhất 20 tổ chức cung ứng dịch vụ trung gian thanh toán; có cơ sở hạ tầng thông tin đáp ứng tối thiểu theo yêu cầu về bảo đảm an toàn hệ thống thông tin cấp độ 4 theo quy định của pháp luật, đảm bảo khả năng tích hợp, kết nối được với hệ thống kỹ thuật của tổ chức tham gia có thỏa thuận kết nối; có hệ thống máy chủ thực hiện theo quy định pháp luật và đáp ứng năng lực xử lý tối thiểu 10 triệu giao dịch thanh toán/ngày;\nTổ chức tham gia không được kết nối quá 02 tổ chức cung ứng dịch vụ chuyển mạch tài chính, dịch vụ bù trừ điện tử;\nh) Đối với dịch vụ chuyển mạch tài chính quốc tế, tổ chức cung ứng dịch vụ phải có Giấy phép hoạt động cung ứng dịch vụ trung gian thanh toán chuyển mạch tài chính còn hiệu lực; được một tổ chức thực hiện quyết toán kết quả bù trừ giữa các bên liên quan; có quy định nội bộ về tiêu chuẩn lựa chọn kết nối các hệ thống thanh toán quốc tế để thực hiện chuyển mạch tài chính các giao dịch thanh toán quốc tế; có quy định nội bộ về quy trình nghiệp vụ kỹ thuật đối với dịch vụ chuyển mạch tài chính quốc tế đề nghị cấp phép và tổ chức vận hành hệ thống thanh toán quốc tế kết nối với tổ chức cung ứng dịch vụ chuyển mạch tài chính quốc tế phải được thành lập và hoạt động hợp pháp ở nước ngoài.", "span": [1005, 1117], "verdict": "", "note": ""}, {"key": "52/2024/NĐ-CP#than/dieu_22#khoan_2||điều kiện b#2.constraint_label: [cảnh báo] thêm dấu hiệu dinh_luong: tối thiểu", "id": "52/2024/NĐ-CP#than/dieu_22#khoan_2", "type": "actor_cu", "tier": 3, "tier_name": "T3 · nghi bịa tình thái", "kind": "nghi bịa: THÊM dấu hiệu tình thái", "warning": "[cảnh báo] thêm dấu hiệu dinh_luong: tối thiểu", "field": "điều kiện b#2.constraint_label", "label": "Tối thiểu 300 tỷ đồng đối với dịch vụ chuyển mạch tài chính, dịch vụ chuyển mạch tài chính quốc tế, dịch vụ bù trừ điện tử", "candidates": [], "dieu_title": "Điều 22. Các dịch vụ trung gian thanh toán và điều kiện cung ứng dịch vụ", "khoan_text": "2. Điều kiện cung ứng dịch vụ trung gia hệ thống kỹ thuật của tổ chức tham gia có thỏa thuận kết nối; có hệ thống máy chủ thực hiện theo quy định pháp luật và đáp ứng năng lực xử lý tối thiểu 10 triệu giao dịch thanh toán/ngày;\nTổ chức tham gia không được kết nối quá 02 tổ chức cung ứng dịch vụ chuyển mạch tài chính, dịch vụ bù trừ điện tử;\nh) Đối với dịch vụ chuyển mạch tài chính quốc tế, tổ chức cung ứng dịch vụ phải có Giấy phép hoạt động cung ứng dịch vụ trung gian thanh toán chuyển mạch tài chính còn hiệu lực; được một tổ chức thực hiện quyết toán kết quả bù trừ giữa các bên liên quan; có quy định nội bộ về tiêu chuẩn lựa chọn kết nối các hệ thống thanh toán quốc tế để thực hiện chuyển mạch tài chính các giao dịch thanh toán quốc tế; có quy định nội bộ về quy trình nghiệp vụ kỹ thuật đối với dịch vụ chuyển mạch tài chính quốc tế đề nghị cấp phép và tổ chức vận hành hệ thống thanh toán quốc tế kết nối với tổ chức cung ứng dịch vụ chuyển mạch tài chính quốc tế phải được thành lập và hoạt động hợp pháp ở nước ngoài.", "span": [1005, 1117], "verdict": "", "note": ""}, {"key": "52/2024/NĐ-CP#than/dieu_26#khoan_1||subject: [cảnh báo] thêm dấu hiệu dieu_kien: khi", "id": "52/2024/NĐ-CP#than/dieu_26#khoan_1", "type": "actor_cu", "tier": 3, "tier_name": "T3 · nghi bịa tình thái", "kind": "nghi bịa: THÊM dấu hiệu tình thái", "warning": "[cảnh báo] thêm dấu hiệu dieu_kien: khi", "field": "subject", "label": "Tổ chức cung ứng dịch vụ trung gian thanh toán khi thay đổi nội dung Giấy phép", "candidates": [], "dieu_title": "Điều 26. Sửa đổi, bổ sung Giấy phép hoạt động cung ứng dịch vụ trung gian thanh toán", "khoan_text": "1. Trường hợp thay đổi một trong các nội dung quy định trong Giấy phép hoạt động cung ứng dịch vụ trung gian thanh toán sau: tên tổ chức, địa điểm đặt trụ sở chính, ngừng cung cấp một hoặc một số dịch vụ trung gian thanh toán đã được cấp phép, kết nối thêm hệ thống thanh toán quốc tế của tổ chức cung ứng dịch vụ chuyển mạch tài chính quốc tế:\na) Tổ chức cung ứng dịch vụ trung gian thanh toán ng là cá nhân)'; 'khách hàng là tổ chức) với'", "id": "17/2024/TT-NHNN#than/dieu_16#khoan_1", "type": "actor_cu", "tier": 4, "tier_name": "T4 · neo sai phạm vi", "kind": "guard không tách được — phạm vi rộng hơn luật", "warning": "guard_ngoai_mau: khớp 'đối với/trường hợp' nhưng không tách được (thuộc tính, giá trị): 'khách hàng là cá nhân)'; 'khách hàng là tổ chức) với'", "field": "điều kiện b", "label": "quy trình, thủ tục mở tài khoản thanh toán bằng phương tiện điện tử", "candidates": [], "dieu_title": "Điều 16. Mở tài khoản thanh toán bằng phương tiện điện tử", "khoan_text": "1. Ngân hàng, chi nhánh ngân hàng nước ngoài ban hành quy định nội bộ về quy trình, thủ tục mở tài khoản thanh toán bằng phương tiện điện tử phù hợp với quy định tại Thông tư này, pháp luật về phòng, chống rửa tiền, giao dịch điện tử, bảo vệ dữ liệu cá nhân, đảm bảo an toàn, bảo mật và bao gồm tối thiểu các bước như sau:\na) Thu thập các tài liệu, thông tin, dữ liệu để xác minh thông tin nhận biết khách hàng theo quy định tại khoản 2, 3 Điều 12 Thông tư này và:\n(i) Thông tin sinh trắc học của chủ tài khoản đối với khách hàng là cá nhân;\n(ii) Thông tin sinh trắc học của người đại diện hợp pháp đối với khách hàng là tổ chức;\nb) Kiểm tra tính hợp pháp, hợp lệ của các tài liệu, thông tin, dữ liệu xác minh thông tin nhận biết khách hàng và phải thực hiện đối chiếu khớp đúng thông tin sinh trắc học của chủ tài khoản thanh toán (đối với khách hàng là cá nhân), người đại diện hợp pháp (đối với khách hàng là tổ chức) với:\n(i) Dữ liệu sinh trắc học được lưu trong bộ phận lưu trữ thông tin được mã hóa của thẻ căn cước công dân hoặc thẻ căn cước đã được xác thực chính xác là do cơ quan Công an cấp hoặc thông qua xác thực tài khoản định danh điện tử của người đó do Hệ thống định danh và xác thực điện tử tạo lập; hoặc\n(ii) Dữ liệu sinh trắc học đã được thu thập và kiểm tra (đảm bảo sự khớp đúng giữa dữ liệu sinh trắc học của người đó với dữ liệu sinh trắc học trong bộ phận lưu trữ thông tin được mã hóa của thẻ căn cước công dân hoặc thẻ căn cước đã được xác thực chính xác là do cơ quan Công an cấp hoặc với dữ liệu sinh trắc học của người đó thông qua xác thực tài khoản định danh điện tử do Hệ thống định danh và xác thực điện tử tạo lập);\nc) Hiển thị cảnh báo cho khách hàng về các hành vi không được thực hiện khi mở và sử dụng tài khoản thanh toán bằng phương tiện điện tử và có giải pháp kỹ thuật xác nhận đảm bảo việc khách hàng đã đọc đầy đủ các nội dung cảnh báo;\nd) Cung cấp cho khách hàng nội dung thỏa thuận mở và sử dụng tài khoản thanh toán theo quy định tại Điều 13 Thông tư này và xác nhận sự chấp thuận của khách hàng đối với thỏa thuận mở và sử dụng tài khoản thanh toán theo quy định tại điểm b khoản 2 Điều này;\nđ) Thông báo cho khách hàng về số hiệu, tên tài khoản thanh toán, hạn mức giao dịch qua tài khoản thanh toán và ngày bắt đầu hoạt động của tài khoản thanh toán.", "span": [630, 1650], "verdict": "", "note": ""}, {"key": "17/2024/TT-NHNN#than/dieu_16#khoan_2||điều kiện b: span không bao hết các tiết của điểm b", "id": "17/2024/TT-NHNN#than/dieu_16#khoan_2", "type": "actor_cu", "tier": 4, "tier_name": "T4 · neo sai phạm vi", "kind": "span không bao hết các tiết", "warning": "span không bao hết các tiết của điểm b", "field": "điều kiện b", "label": "Việc khách hàng chấp thuận với các nội dung tại thỏa thuận mở và sử dụng tài khoản thanh toán", "candidates": [], "dieu_title": "Điều 16. Mở tài khoản thanh toán bằng phương tiện điện tử", "khoan_text": "2. Ngân hàng, chi nhánh ngân hàng nước ngoài tự quyết định biện pháp, hình thức, công nghệ phục vụ việc mở tài khoản thanh toán bằng phương tiện điện tử, tự chịu rủi ro phát sinh (nếu có) và phải đáp ứng tối thiểu các yêu cầu sau:\na) Biện pháp, hình thức, công nghệ được ngân hàng, chi nhánh ngân hàng nước ngoài lựa chọn phải đảm bảo tiêu chuẩn về an ninh, an toàn, bảo mật theo quy định của Ngân hàng Nhà nước;\nb) Xác nhận việc khách hàng chấp thuận với các nội dung tại thỏa thuận mở và sử dụng tài khoản thanh toán:\n(i) Đối với tài khoản thanh toán của cá nhân: có biện pháp kỹ thuật sử dụng hình thức xác nhận bằng phương tiện điện từ để thể hiện sự chấp thuận của chủ tài khoản đối với các nội dung tại thỏa thuận mở và sử dụng tài khoản thanh toán;\n(ii) Đối với tài khoản thanh toán của tổ chức: người đại diện hợp pháp ký chữ ký điện tử để khẳng định sự chấp thuận của chủ tài khoản đối với các nội dung tại thỏa thuận mở và sử dụng tài khoản thanh toán;\nc) Lưu trữ, bảo quản đầy đủ, chi tiết đối với các tài liệu, thông tin, dữ liệu nhận biết khách hàng trong quá trình mở, sử dụng tài khoản thanh toán bằng phương tiện điện tử, như: thông tin nhận biết khách hàng; các yếu tố sinh trắc học của chủ tài khoản thanh toán cá nhân, người đại diện hợp pháp của tổ chức mở tài khoản thanh toán; âm thanh, hình ảnh, bản ghi hình, ghi âm; số điện thoại đăng ký giao dịch trên phần mềm ứng dụng giao dịch ngân hàng trên internet, điện thoại di động; thông tin định danh duy nhất của thiết bị giao dịch (địa chỉ MAC); nhật ký giao dịch; kết quả đối chiếu thông tin sinh trắc học theo quy định tại điểm b khoản 1 Điều này. Các thông tin, dữ liệu phải được lưu trữ an toàn, bảo mật, được sao lưu dự phòng, đảm bảo tính đầy đủ, toàn vẹn của dữ liệu để phục vụ cho công tác kiểm tra, đối chiếu, xác thực chủ tài khoản trong quá trình sử dụng tài khoản thanh toán, giải quyết tra soát, khiếu nại, tranh chấp và cung cấp thông tin khi có yêu cầu từ cơ quan có thẩm quyền. Thời gian thực hiện theo quy định của pháp luật về phòng, chống rửa tiền và giao dịch điện tử;\nd) Ngân hàng, chi nhánh ngân hàng nước ngoài phải thường xuyên kiểm tra, đánh giá mức độ an toàn, bảo mật của biện pháp, hình thức, công nghệ và thực hiện tạm dừng cung cấp dịch vụ để nâng cấp, chỉnh sửa, hoàn thiện trong trường hợp có dấu hiệu mất an toàn.", "span": [416, 518], "verdict": "", "note": ""}, {"key": "17/2024/TT-NHNN#than/dieu_16#khoan_2||điều kiện c.constraint_label: ⇒ 'quote' thu hẹp sai chỗ: `text` của trường này KHÔN hi âm; số điện thoại đăng ký giao dịch trên phần mềm ứng dụng giao dịch ngân hàng trên internet, điện thoại di động; thông tin định danh duy nhất của thiết bị giao dịch (địa chỉ MAC); nhật ký giao dịch; kết quả đối chiếu thông tin sinh trắc học theo quy định tại điểm b khoản 1 Điều này. Các thông tin, dữ liệu phải được lưu trữ an toàn, bảo mật, được sao lưu dự phòng, đảm bảo tính đầy đủ, toàn vẹn của dữ liệu để phục vụ cho công tác kiểm tra, đối chiếu, xác thực chủ tài khoản trong quá trình sử dụng tài khoản thanh toán, giải quyết tra soát, khiếu nại, tranh chấp và cung cấp thông tin khi có yêu cầu từ cơ quan có thẩm quyền. Thời gian thực hiện theo quy định của pháp luật về phòng, chống rửa tiền và giao dịch điện tử;\nd) Ngân hàng, chi nhánh ngân hàng nước ngoài phải thường xuyên kiểm tra, đánh giá mức độ an toàn, bảo mật của biện pháp, hình thức, công nghệ và thực hiện tạm dừng cung cấp dịch vụ để nâng cấp, chỉnh sửa, hoàn thiện trong trường hợp có dấu hiệu mất an toàn.", "span": [966, 1136], "verdict": "", "note": ""}, {"key": "40/2024/TT-NHNN#than/dieu_25#khoan_6||điều kiện c: guard_ngoai_mau: khớp 'đối với/trường hợp' nhưng không tách được (thuộc tính, giá trị): 'khách hàng tổ chức) với'", "id": "40/2024/TT-NHNN#than/dieu_25#khoan_6", "type": "actor_cu", "tier": 4, "tier_name": "T4 · neo sai phạm vi", "kind": "guard không tách được — phạm vi rộng hơn luật", "warning": "guard_ngoai_mau: khớp 'đối với/trường hợp' nhưng không tách được (thuộc tính, giá trị): 'khách hàng tổ chức) với'", "field": "điều kiện c", "label": "Ví điện tử", "candidates": [], "dieu_title": "Điều 25. Sử dụng dịch vụ ví điện tử", "khoan_text": "6. Tổ chức cung ứng dịch vụ ví điện tử hướng dẫn khách hàng sử dụng ví điện tử đảm bảo nguyên tắc:\na) Phạm vi sử dụng và hạn mức giao dịch theo từng đối tượng khách hàng phù hợp với quy định về quản lý rủi ro, thỏa thuận mở và sử dụng ví điện tử theo quy định tại\nđiểm c khoản 1 Điều 28 Thông tư này;\nb) Có đủ thông tin cần thiết để kiểm tra, đối chiếu, xác minh thông tin nhận biết khách hàng trong quá trình sử dụng ví điện tử;\nc) Chỉ được sử dụng ví điện tử để thực hiện các giao dịch theo quy định tại\nkhoản 2 Điều 25 Thông tư này\nbằng phương tiện điện tử khi đã hoàn thành việc đối chiếu khớp đúng giấy tờ tùy thân và thông tin sinh trắc học của chủ ví điện tử hoặc người đại diện (đối với khách hàng cá nhân) hoặc người đại diện hợp pháp (đối với khách hàng tổ chức) với:\n(i) Dữ liệu sinh trắc học được lưu trong bộ phận lưu trữ thông tin được mã hóa của thẻ căn cước công dân hoặc thẻ căn cước của người đó đã được xác thực chính xác là do cơ quan Công an cấp hoặc thông qua xác thực tài khoản định danh điện tử của người đó do Hệ thống định danh và xác thực điện tử tạo lập; hoặc\n(ii) Dữ liệu sinh trắc học được thu thập thông qua gặp mặt trực tiếp người đó đối với trường hợp là người nước ngoài không sử dụng danh tính điện tử, người gốc Việt Nam chưa xác định được quốc tịch; hoặc\n(iii) Dữ liệu sinh trắc học đã được thu thập và kiểm tra (đảm bảo sự khớp đúng giữa dữ liệu sinh trắc học của người đó với dữ liệu sinh trắc học trong bộ phận lưu trữ thông tin được mã hóa của thẻ căn cước công dân hoặc thẻ căn cước đã được xác thực chính xác là do cơ quan Công an cấp hoặc với dữ liệu sinh trắc học của người đó thông qua xác thực tài khoản định danh điện tử do Hệ thống định danh và xác thực điện tử tạo lập); hoặc\n(iv) Dữ liệu sinh trắc học của người đó được lưu trong Cơ sở dữ liệu quốc gia về dân cư trong trường hợp sử dụng thẻ căn cước công dân không có bộ phận lưu trữ thông tin được mã hóa;\nd) Áp dụng các biện pháp xác thực đối với từng loại giao dịch trong thanh toán bằng phương tiện điện tử theo quy định của Ngân hàng Nhà nước.", "span": [430, 1908], "verdict": "", "note": ""}, {"key": "52/2024/NĐ-CP#than/dieu_22#khoan_2||điều kiện b#1: guard_ngoai_mau: khớp 'đối với/trường hợp' nhưng không tách được (thuộc tính, giá trị): 'dịch vụ ví điện tử'; 'dịch vụ chuyển mạch tài chính'", "id": "52/2024/NĐ-CP#than/dieu_22#khoan_2", "type": "actor_cu", "tier": 4, "tier_name": "T4 · neo sai phạm vi", "kind": "guard không tách được — phạm vi rộng hơn luật", "warning": "guard_ngoai_mau: khớp 'đối với/trường hợp' nhưng không tách được (thuộc tính, giá trị): 'dịch vụ ví điện tử'; 'dịch vụ chuyển mạch tài chính'", "field": "điều kiện b#1", "label": "Vốn điều lệ thực góp hoặc được cấp", "candidates": [], "dieu_title": "Điều 22. Các dịch vụ trung gian thanh toán và điều kiện cung ứng dịch vụ", "khoan_text": "2. Điều kiện cung ứng dịch vụ trung gian thanh toán:\nTổ chức không phải là ngân hàng, chi nhánh ngân hàng nước ngoài được Ngân hàng Nhà nước cấp Giấy phép hoạt động cung ứng dịch vụ trung gian thanh toán khi đáp ứng đầy đủ và phải đảm bảo duy trì đủ các điều kiện sau đây trong quá trình cung ứng dịch vụ trung gian thanh toán, cụ thể như sau:\na) Có giấy phép thành lập hoặc giấy chứng nhận đăng ký doanh nghiệp do cơ quan nhà nước có thẩm quyền cấp và không đang trong quá trình chia, tách, hợp nhất, sáp nhập, chuyển đổi, giải thể, phá sản theo quyết định đã được ban hành trong quá trình đề nghị cấp Giấy phép hoạt động cung ứng dịch vụ trung gian thanh toán; trường hợp cung ứng dịch vụ chuyển mạch tài chính, dịch vụ bù trừ điện tử, tổ chức phải đảm bảo không kinh doanh ngành nghề khác ngoài hoạt động cung ứng dịch vụ trung gian thanh toán;\nb) Có vốn điều lệ thực góp hoặc được cấp tối thiểu: 50 tỷ đồng đối với dịch vụ ví điện tử, dịch vụ hỗ trợ thu hộ, chi hộ và dịch vụ cổng thanh toán điện tử; 300 tỷ đồng đối với dịch vụ chuyển mạch tài chính, dịch vụ chuyển mạch tài chính quốc tế, dịch vụ bù trừ điện tử; chịu hoàn toàn trách nhiệm về tính hợp pháp của nguồn vốn đã góp hoặc vốn được cấp;\nc) Có Đề án cung ứng dịch vụ trung gian thanh toán được cấp có thẩm quyền theo quy định tại Điều lệ của tổ chức phê duyệt theo\nMẫu số 08 ban hành kèm theo Nghị định này;\nd) Điều kiện về nhân sự: Người đại diện theo pháp luật, Tổng Giám đốc (Giám đốc) của tổ chức phải có bằng đại học trở lên về một trong các ngành kinh tế, quản trị kinh doanh, luật, công nghệ thông tin và có ít nhất 05 năm kinh nghiệm là người quản lý, người điều hành của tổ chức trong lĩnh vực tài chính, ngân hàng và không thuộc những đối tượng bị cấm theo quy định của pháp luật; phải bảo đảm luôn có ít nhất một người đại diện theo pháp luật cư trú tại Việt Nam (Khi chỉ còn lại một người đại diện theo pháp luật cư trú tại Việt Nam thì người này khi xuất cảnh khỏi Việt Nam phải ủy quyền bằng văn bản cho cá nhân khác cư trú tại Việt Nam thực hiện quyền và nghĩa vụ của người đại diện theo pháp luật. Trường hợp này, người đại diện theo pháp luật vẫn phải chịu trách nhiệm về việc thực hiện quyền và nghĩa vụ đã ủy quyền).\nPhó Tổng Giám đốc (Phó Giám đốc) và các cán bộ chủ chốt thực hiện Đề án cung ứng dịch vụ trung gian thanh toán (gồm Trưởng phòng (ban) hoặc tương đương và các cán bộ kỹ thuật) có bằng cao đẳng trở lên về một trong các ngành kinh tế, quản trị kinh doanh, luật, công nghệ thông tin hoặc lĩnh vực chuyên môn đảm nhiệm;\nđ) Có Bản thuyết minh giải pháp kỹ thuật phục vụ cho hoạt động cung ứng dịch vụ trung gian thanh toán đề nghị cấp Giấy phép được cấp có thẩm quyền theo quy định tại Điều lệ của tổ chức phê duyệt đáp ứng yêu cầu đảm bảo an toàn hệ thống thông tin cấp độ 3 theo quy định của pháp luật;\ne) Đối với dịch vụ ví điện tử và dịch vụ hỗ trợ thu hộ, chi hộ cho các khách hàng có tài khoản tại nhiều ngân hàng, chi nhánh ngân hàng nước ngoài, tổ chức cung ứng dịch vụ phải được một tổ chức cung ứng dịch vụ chuyển mạch tài chính và dịch vụ bù trừ điện tử được Ngân hàng Nhà nước cấp phép để thực hiện chuyển mạch giao dịch tài chính và xử lý bù trừ các nghĩa vụ phát sinh trong quá trình cung ứng dịch vụ trung gian thanh toán của tổ chức;\ng) Đối với dịch vụ chuyển mạch tài chính, dịch vụ bù trừ điện tử, ngoài các điều kiện quy định tại điểm a, điểm b, điểm c, điểm d và điểm đ khoản 2 Điều này, tổ chức cung ứng dịch vụ phải: được một tổ chức thực hiện quyết toán kết quả bù trừ giữa các bên liên quan; có thỏa thuận kết nối với ít nhất 50 ngân hàng, chi nhánh ngân hàng nước ngoài có tổng vốn điều lệ trong năm liền kề trước năm nộp hồ sơ đề nghị cấp Giấy phép chiếm trên 65% tổng vốn điều lệ của các ngân hàng, chi nhánh ngân hàng nước ngoài trong hệ thống các tổ chức tín dụng và ít nhất 20 tổ chức cung ứng dịch vụ trung gian thanh toán; có cơ sở hạ tầng thông tin đáp ứng tối thiểu theo yêu cầu về bảo đảm an toàn hệ thống thông tin cấp độ 4 theo quy định của pháp luật, đảm bảo khả năng tích hợp, kết nối được với hệ thống kỹ thuật của tổ chức tham gia có thỏa thuận kết nối; có hệ thống máy chủ thực hiện theo quy định pháp luật và đáp ứng năng lực xử lý tối thiểu 10 triệu giao dịch thanh toán/ngày;\nTổ chức tham gia không được kết nối quá 02 tổ chức cung ứng dịch vụ chuyển mạch tài chính, dịch vụ bù trừ điện tử;\nh) Đối với dịch vụ chuyển mạch tài chính quốc tế, tổ chức cung ứng dịch vụ phải có Giấy phép hoạt động cung ứng dịch vụ trung gian thanh toán chuyển mạch tài chính còn hiệu lực; được một tổ chức thực hiện quyết toán kết quả bù trừ giữa các bên liên quan; có quy định nội bộ về tiêu chuẩn lựa chọn kết nối các hệ thống thanh toán quốc tế để thực hiện chuyển mạch tài chính các giao dịch thanh toán quốc tế; có quy định nội bộ về quy trình nghiệp vụ kỹ thuật đối với dịch vụ chuyển mạch tài chính quốc tế đề nghị cấp phép và tổ chức vận hành hệ thống thanh toán quốc tế kết nối với tổ chức cung ứng dịch vụ chuyển mạch tài chính quốc tế phải được thành lập và hoạt động hợp pháp ở nước ngoài.", "span": [851, 1003], "verdict": "", "note": ""}, {"key": "52/2024/NĐ-CP#than/dieu_22#khoan_2||điều kiện b#2: guard_ngoai_mau: khớp 'đối với/trường hợp' nhưng không tách được (thuộc tính, giá trị): 'dịch vụ ví điện tử'; 'dịch vụ chuyển mạch tài chính'", "id": "52/2024/NĐ-CP#than/dieu_22#khoan_2", "type": "actor_cu", "tier": 4, "tier_name": "T4 · neo sai phạm vi", "kind": "guard không tách được — phạm vi rộng hơn luật", "warning": "guard_ngoai_mau: khớp 'đối với/trường hợp' như iều lệ của các ngân hàng, chi nhánh ngân hàng nước ngoài trong hệ thống các tổ chức tín dụng và ít nhất 20 tổ chức cung ứng dịch vụ trung gian thanh toán; có cơ sở hạ tầng thông tin đáp ứng tối thiểu theo yêu cầu về bảo đảm an toàn hệ thống thông tin cấp độ 4 theo quy định của pháp luật, đảm bảo khả năng tích hợp, kết nối được với hệ thống kỹ thuật của tổ chức tham gia có thỏa thuận kết nối; có hệ thống máy chủ thực hiện theo quy định pháp luật và đáp ứng năng lực xử lý tối thiểu 10 triệu giao dịch thanh toán/ngày;\nTổ chức tham gia không được kết nối quá 02 tổ chức cung ứng dịch vụ chuyển mạch tài chính, dịch vụ bù trừ điện tử;\nh) Đối với dịch vụ chuyển mạch tài chính quốc tế, tổ chức cung ứng dịch vụ phải có Giấy phép hoạt động cung ứng dịch vụ trung gian thanh toán chuyển mạch tài chính còn hiệu lực; được một tổ chức thực hiện quyết toán kết quả bù trừ giữa các bên liên quan; có quy định nội bộ về tiêu chuẩn lựa chọn kết nối các hệ thống thanh toán quốc tế để thực hiện chuyển mạch tài chính các giao dịch thanh toán quốc tế; có quy định nội bộ về quy trình nghiệp vụ kỹ thuật đối với dịch vụ chuyển mạch tài chính quốc tế đề nghị cấp phép và tổ chức vận hành hệ thống thanh toán quốc tế kết nối với tổ chức cung ứng dịch vụ chuyển mạch tài chính quốc tế phải được thành lập và hoạt động hợp pháp ở nước ngoài.", "span": [1005, 1117], "verdict": "", "note": ""}, {"key": "52/2024/NĐ-CP#than/dieu_22#khoan_2||điều kiện b#3: guard_ngoai_mau: khớp 'đối với/trường hợp' nhưng không tách được (thuộc tính, giá trị): 'dịch vụ ví điện tử'; 'dịch vụ chuyển mạch tài chính'", "id": "52/2024/NĐ-CP#than/dieu_22#khoan_2", "type": "actor_cu", "tier": 4, "tier_name": "T4 · neo sai phạm vi", "kind": "guard không tách được — phạm vi rộng hơn luật", "warning": "guard_ngoai_mau: khớp 'đối với/trường hợp' nhưng không tách được (thuộc tính, giá trị): 'dịch vụ ví điện tử'; 'dịch vụ chuyển mạch tài chính'", "field": "điều kiện b#3", "label": "Nguồn vốn đã góp hoặc vốn được cấp", "candidates": [],  nhánh ngân hàng nước ngoài được Ngân hàng Nhà nước cấp Giấy phép hoạt động cung ứng dịch vụ trung gian thanh toán khi đáp ứng đầy đủ và phải đảm bảo duy trì đủ các điều kiện sau đây trong quá trình cung ứng dịch vụ trung gian thanh toán, cụ thể như sau:\na) Có giấy phép thành lập hoặc giấy chứng nhận đăng ký doanh nghiệp do cơ quan nhà nước có thẩm quyền cấp và không đang trong quá trình chia, tách, hợp nhất, sáp nhập, chuyển đổi, giải thể, phá sản theo quyết định đã được ban hành trong quá trình đề nghị cấp Giấy phép hoạt động cung ứng dịch vụ trung gian thanh toán; trường hợp cung ứng dịch vụ chuyển mạch tài chính, dịch vụ bù trừ điện tử, tổ chức phải đảm bảo không kinh doanh ngành nghề khác ngoài hoạt động cung ứng dịch vụ trung gian thanh toán;\nb) Có vốn điều lệ thực góp hoặc được cấp tối thiểu: 50 tỷ đồng đối với dịch vụ ví điện tử, dịch vụ hỗ trợ thu hộ, chi hộ và dịch vụ cổng thanh toán điện tử; 300 tỷ đồng đối với dịch vụ chuyển mạch tài chính, dịch vụ chuyển mạch tài chính quốc tế, dịch vụ bù trừ điện tử; chịu hoàn toàn trách nhiệm về tính hợp pháp của nguồn vốn đã góp hoặc vốn được cấp;\nc) Có Đề án cung ứng dịch vụ trung gian thanh toán được cấp có thẩm quyền theo quy định tại Điều lệ của tổ chức phê duyệt theo\nMẫu số 08 ban hành kèm theo Nghị định này;\nd) Điều kiện về nhân sự: Người đại diện theo pháp luật, Tổng Giám đốc (Giám đốc) của tổ chức phải có bằng đại học trở lên về một trong các ngành kinh tế, quản trị kinh doanh, luật, công nghệ thông tin và có ít nhất 05 năm kinh nghiệm là người quản lý, người điều hành của tổ chức trong lĩnh vực tài chính, ngân hàng và không thuộc những đối tượng bị cấm theo quy định của pháp luật; phải bảo đảm luôn có ít nhất một người đại diện theo pháp luật cư trú tại Việt Nam (Khi chỉ còn lại một người đại diện theo pháp luật cư trú tại Việt Nam thì người này khi xuất cảnh khỏi Việt Nam phải ủy quyền bằng văn bản cho cá nhân khác cư trú tại Việt Nam thực hiện quyền và nghĩa vụ của người đại diện theo pháp luật. Trườn ban) hoặc tương đương và các cán bộ kỹ thuật) có bằng cao đẳng trở lên về một trong các ngành kinh tế, quản trị kinh doanh, luật, công nghệ thông tin hoặc lĩnh vực chuyên môn đảm nhiệm;\nđ) Có Bản thuyết minh giải pháp kỹ thuật phục vụ cho hoạt động cung ứng dịch vụ trung gian thanh toán đề nghị cấp Giấy phép được cấp có thẩm quyền theo quy định tại Điều lệ của tổ chức phê duyệt đáp ứng yêu cầu đảm bảo an toàn hệ thống thông tin cấp độ 3 theo quy định của pháp luật;\ne) Đối với dịch vụ ví điện tử và dịch vụ hỗ trợ thu hộ, chi hộ cho các khách hàng có tài khoản tại nhiều ngân hàng, chi nhánh ngân hàng nước ngoài, tổ chức cung ứng dịch vụ phải được một tổ chức cung ứng dịch vụ chuyển mạch tài chính và dịch vụ bù trừ điện tử được Ngân hàng Nhà nước cấp phép để thực hiện chuyển mạch giao dịch tài chính và xử lý bù trừ các nghĩa vụ phát sinh trong quá trình cung ứng dịch vụ trung gian thanh toán của tổ chức;\ng) Đối với dịch vụ chuyển mạch tài chính, dịch vụ bù trừ điện tử, ngoài các điều kiện quy định tại điểm a, điểm b, điểm c, điểm d và điểm đ khoản 2 Điều này, tổ chức cung ứng dịch vụ phải: được một tổ chức thực hiện quyết toán kết quả bù trừ giữa các bên liên quan; có thỏa thuận kết nối với ít nhất 50 ngân hàng, chi nhánh ngân hàng nước ngoài có tổng vốn điều lệ trong năm liền kề trước năm nộp hồ sơ đề nghị cấp Giấy phép chiếm trên 65% tổng vốn điều lệ của các ngân hàng, chi nhánh ngân hàng nước ngoài trong hệ thống các tổ chức tín dụng và ít nhất 20 tổ chức cung ứng dịch vụ trung gian thanh toán; có cơ sở hạ tầng thông tin đáp ứng tối thiểu theo yêu cầu về bảo đảm an toàn hệ thống thông tin cấp độ 4 theo quy định của pháp luật, đảm bảo khả năng tích hợp, kết nối được với hệ thống kỹ thuật của tổ chức tham gia có thỏa thuận kết nối; có hệ thống máy chủ thực hiện theo quy định pháp luật và đáp ứng năng lực xử lý tối thiểu 10 triệu giao dịch thanh toán/ngày;\nTổ chức tham gia không được kết nối quá 02 tổ chức cung ứng dịch vụ chuyển mạch tài chính, dịch vụ bù trừ điện tử;\nh) Đối với dịch vụ chuyển mạch tài chính quốc tế, tổ chức cung ứng dịch vụ phải có Giấy phép hoạt động cung ứng dịch vụ trung gian thanh toán chuyển mạch tài chính còn hiệu lực; được một tổ chức thực hiện quyết toán kết quả bù trừ giữa các bên liên quan; có quy định nội bộ về tiêu chuẩn lựa chọn kết nối các hệ thống thanh toán quốc tế để thực hiện chuyển mạch tài chính các giao dịch thanh toán quốc tế; có quy định nội bộ về quy trình nghiệp vụ kỹ thuật đối với dịch vụ chuyển mạch tài chính quốc tế đề nghị cấp phép và tổ chức vận hành hệ thống thanh toán quốc tế kết nối với tổ chức cung ứng dịch vụ chuyển mạch tài chính quốc tế phải được thành lập và hoạt động hợp pháp ở nước ngoài.", "span": [3512, 3849], "verdict": "", "note": ""}, {"key": "52/2024/NĐ-CP#than/dieu_22#khoan_2||điều kiện g#3: guard_ngoai_mau: khớp 'đối với/trường hợp' nhưng không tách được (thuộc tính, giá trị): 'dịch vụ chuyển mạch tài chính'", "id": "52/2024/NĐ-CP#than/dieu_22#khoan_2", "type": "actor_cu", "tier": 4, "tier_name": "T4 · neo sai phạm vi", "kind": "guard không tách được — phạm vi rộng hơn luật", "warning": "guard_ngoai_mau: khớp 'đối với/trường hợp' nhưng không tách được (thuộc tính, giá trị): 'dịch vụ chuyển mạch tài chính'", "field": "điều kiện g#3", "label": "Cơ sở hạ tầng thông tin", "candidates": [], "dieu_title": "Điều 22. Các dịch vụ trung gian thanh toán và điều kiện cung ứng dịch vụ", "khoan_text": "2. Điều kiện cung ứng dịch vụ trung gian thanh toán:\nTổ chức không phải là ngân hàng, chi nhánh ngân hàng nước ngoài được Ngân hàng Nhà nước cấp Giấy phép hoạt động cung ứng dịch vụ trung gian thanh toán khi đáp ứng đầy đủ và phải đảm bảo duy trì đủ các điều kiện sau đây trong quá trình cung ứng dịch vụ trung gian thanh toán, cụ thể như sau:\na) Có giấy phép thành lập hoặc giấy chứng nhận đăng ký doanh nghiệp do cơ quan nhà nước có thẩm quyền cấp và không đang trong quá trình chia, tách, hợp nhất, sáp nhập, chuyển đổi, giải thể, phá sản theo quyết định đã được ban hành tron i chính quốc tế, dịch vụ bù trừ điện tử; chịu hoàn toàn trách nhiệm về tính hợp pháp của nguồn vốn đã góp hoặc vốn được cấp;\nc) Có Đề án cung ứng dịch vụ trung gian thanh toán được cấp có thẩm quyền theo quy định tại Điều lệ của tổ chức phê duyệt theo\nMẫu số 08 ban hành kèm theo Nghị định này;\nd) Điều kiện về nhân sự: Người đại diện theo pháp luật, Tổng Giám đốc (Giám đốc) của tổ chức phải có bằng đại học trở lên về một trong các ngành kinh tế, quản trị kinh doanh, luật, công nghệ thông tin và có ít nhất 05 năm kinh nghiệm là người quản lý, người điều hành của tổ chức trong lĩnh vực tài chính, ngân hàng và không thuộc những đối tượng bị cấm theo quy định của pháp luật; phải bảo đảm luôn có ít nhất một người đại diện theo pháp luật cư trú tại Việt Nam (Khi chỉ còn lại một người đại diện theo pháp luật cư trú tại Việt Nam thì người này khi xuất cảnh khỏi Việt Nam phải ủy quyền bằng văn bản cho cá nhân khác cư trú tại Việt Nam thực hiện quyền và nghĩa vụ của người đại diện theo pháp luật. Trường hợp này, người đại diện theo pháp luật vẫn phải chịu trách nhiệm về việc thực hiện quyền và nghĩa vụ đã ủy quyền).\nPhó Tổng Giám đốc (Phó Giám đốc) và các cán bộ chủ chốt thực hiện Đề án cung ứng dịch vụ trung gian thanh toán (gồm Trưởng phòng (ban) hoặc tương đương và các cán bộ kỹ thuật) có bằng cao đẳng trở lên về một trong các ngành kinh tế, quản trị kinh doanh, luật, công nghệ thông tin hoặc lĩnh vực chuyên môn đảm nhiệm;\nđ) Có Bản thuyết minh giải pháp kỹ thuật phục vụ cho hoạt động cung ứng dịch vụ trung gian thanh toán đề nghị cấp Giấy phép được cấp có thẩm quyền theo quy định tại Điều lệ của tổ chức phê duyệt đáp ứng yêu cầu đảm bảo an toàn hệ thống thông tin cấp độ 3 theo quy định của pháp luật;\ne) Đối với dịch vụ ví điện tử và dịch vụ hỗ trợ thu hộ, chi hộ cho các khách hàng có tài khoản tại nhiều ngân hàng, chi nhánh ngân hàng nước ngoài, tổ chức cung ứng dịch vụ phải được một tổ chức cung ứng dịch vụ chuyển mạch tài chính và dịch vụ bù trừ điện tử được Ngân h , "type": "meta_cu", "tier": 4, "tier_name": "T4 · neo sai phạm vi", "kind": "cổng thời gian thiếu mốc ngày", "warning": "cổng thời gian nhưng chưa tách được mốc ngày ở dạng cấu trúc — mốc (nếu có) chỉ còn là chữ tự do trong `menh_de`", "field": "—", "label": "", "candidates": [], "dieu_title": "Điều 37. Hiệu lực thi hành", "khoan_text": "2. Nghị định này thay thế cho Nghị định số\n101/2012/NĐ-CP\nngày 22 tháng 11 năm 2012 của Chính phủ về thanh toán không dùng tiền mặt; Nghị định số\n80/2016/NĐ-CP\nngày 01 tháng 7 năm 2016 của Chính phủ sửa đổi, bổ sung một số điều của Nghị định số\n101/2012/NĐ-CP\nngày 22 tháng 11 năm 2012 của Chính phủ về thanh toán không dùng tiền mặt và bãi bỏ\nĐiều 3\ncủa Nghị định số\n16/2019/NĐ-CP\nngày 01 tháng 02 năm 2019 của Chính phủ sửa đổi, bổ sung một số điều của các Nghị định quy định về điều kiện kinh doanh thuộc phạm vi quản lý nhà nước của Ngân hàng Nhà nước.", "span": null, "verdict": "", "note": ""}]};
const CAN_SAVE = false;
const KEY = "lexflow-flags-v1";

const saved = JSON.parse(localStorage.getItem(KEY) || "{}");
DATA.cards.forEach(c => {
  const s = saved[c.key];
  if (s) { c.verdict = s.verdict || c.verdict; c.note = s.note || c.note; }
});

const esc = s => String(s == null ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;").replace(/'/g,"&#39;");

function lawHtml(c) {
  const t = c.khoan_text || "";
  if (!c.span) return esc(t);
  const [a, b] = c.span;
  return esc(t.slice(0, a)) + "<mark>" + esc(t.slice(a, b)) + "</mark>" + esc(t.slice(b));
}

function persist() {
  const o = {};
  DATA.cards.forEach(c => { if (c.verdict || c.note) o[c.key] = {verdict: c.verdict, note: c.note}; });
  localStorage.setItem(KEY, JSON.stringify(o));
  const n = DATA.cards.filter(c => c.verdict).length;
  document.getElementById("prog").textContent =
    n + "/" + DATA.cards.length + " cờ đã quyết";
}

function render() {
  const hide = document.getElementById("hideDone").checked;
  const app = document.getElementById("app");
  let html = "";

  DATA.cards.forEach((c, i) => {
    if (hide && c.verdict) return;
    html += '<div class="card' + (c.verdict ? " done" : "") + '" id="c' + i + '">';
    html += '<div class="chead"><span class="tag' + (c.tier <= 1 ? " t1" : "") + '">' +
      esc(c.tier_name) + '</span><b>' + esc(c.kind) + '</b>' +
      '<code>' + esc(c.field) + '</code>' +
      '<span style="flex:1"></span><span class="muted">' + esc(c.id) + '</span></div>';
    html += '<div class="cbody">';
    html += '<div class="row"><div class="lbl">Máy nói</div><div class="quote">' +
      esc(c.warning) + '</div></div>';
    if (c.label) {
      html += '<div class="row"><div class="lbl">Nhãn mô hình</div><div class="quote">' +
        esc(c.label) + '</div></div>';
    }
    if (c.candidates && c.candidates.length) {
      html += '<div class="amb">⚠️ Địa chỉ mơ hồ: ' + c.candidates.length +
        ' điều kiện cùng nhãn này (bản ghi sinh trước khi <code>extractor.py</code> đánh số). ' +
        'Phải đọc cả:<ul>' + c.candidates.map(t => "<li>" + esc(t) + "</li>").join("") +
        '</ul></div>';
    }
    html += '<div class="row"><div class="lbl">Chữ của luật</div><div class="law">' +
      lawHtml(c) + '</div></div>';
    html += '<div class="acts">' +
      ['dung', 'sai', 'khong_chac'].map(v =>
        '<button data-i="' + i + '" data-v="' + v + '"' +
        (c.verdict === v ? ' class="on"' : '') + '>' +
        {dung: "Cờ ĐÚNG", sai: "Báo động GIẢ", khong_chac: "Không chắc"}[v] + '</button>'
      ).join("") +
      '<input class="note" data-i="' + i + '" placeholder="ghi chú (tuỳ chọn)" value="' +
      esc(c.note) + '">' +
      '</div>';
    html += '</div></div>';
  });
  app.innerHTML = html || '<p class="muted">Không còn cờ nào để quyết.</p>';
  persist();
}

document.addEventListener("click", e => {
  const b = e.target.closest("button[data-v]");
  if (!b) return;
  const c = DATA.cards[+b.dataset.i];
  c.verdict = c.verdict === b.dataset.v ? "" : b.dataset.v;
  render();
});
document.addEventListener("input", e => {
  if (!e.target.classList.contains("note")) return;
  DATA.cards[+e.target.dataset.i].note = e.target.value;
  persist();
});
document.getElementById("hideDone").addEventListener("change", render);

function rows() {
  return DATA.cards.map(c => ({
    key: c.key, id: c.id, field: c.field, tier: c.tier, kind: c.kind,
    warning: c.warning, verdict: c.verdict || "", note: c.note || ""
  }));
}

document.getElementById("dl").addEventListener("click", () => {
  const body = rows().map(r => JSON.stringify(r)).join("\n") + "\n";
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([body], {type: "application/x-ndjson"}));
  a.download = "flag_verdicts.jsonl";
  a.click();
});

// Trạng thái báo bằng một dòng chữ trong header, KHÔNG dùng alert(): hộp thoại của
// trình duyệt chặn toàn bộ event loop của tab, nên trang đứng im cho tới khi có người
// bấm OK — và với công cụ tự động thì nó treo hẳn phiên làm việc.
function flash(msg, bad) {
  const el = document.getElementById("stat");
  el.textContent = msg;
  el.style.color = bad ? "var(--bad)" : "var(--ok)";
  clearTimeout(flash._t);
  flash._t = setTimeout(() => { el.textContent = ""; }, 4000);
}

document.getElementById("save").addEventListener("click", async () => {
  if (!CAN_SAVE) {
    flash("Chạy với --serve để Lưu ghi thẳng file — hiện hãy dùng nút Tải.", true);
    return;
  }
  try {
    const r = await fetch("/", {method: "POST", body: JSON.stringify(rows())});
    const j = await r.json();
    flash("Đã lưu " + j.reviewed + "/" + DATA.cards.length + " cờ đã quyết.");
  } catch (e) {
    flash("Lưu hỏng: " + e.message, true);
  }
});

render();
</script>
</body>
</html>
