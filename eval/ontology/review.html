<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Duyệt bộ nhãn ontology</title>
<style>
:root{--bg:#fff;--fg:#1c1917;--dim:#6b7280;--line:#e7e5e4;--panel:#fafaf9;
 --subj:#2563eb;--subjbg:#dbeafe;--act:#b45309;--actbg:#fef3c7;--cond:#047857;--condbg:#d1fae5;
 --err:#b91c1c;--errbg:#fef2f2;--ok:#047857;}
@media(prefers-color-scheme:dark){:root{--bg:#1c1917;--fg:#e7e5e4;--dim:#a8a29e;--line:#44403c;
 --panel:#292524;--subjbg:#1e3a5f;--actbg:#4a3410;--condbg:#053c2e;--errbg:#2a1315;}}
*{box-sizing:border-box}
body{margin:0;font:14px/1.6 system-ui,"Segoe UI",sans-serif;background:var(--bg);color:var(--fg)}
#app{display:grid;grid-template-columns:230px 1fr 340px;height:100vh}
@media(max-width:1100px){#app{grid-template-columns:1fr;height:auto}}
aside,section,#side{overflow-y:auto;padding:12px}
aside{border-right:1px solid var(--line);background:var(--panel)}
#side{border-left:1px solid var(--line);background:var(--panel)}
h1{font-size:15px;margin:0 0 10px}
.item{padding:5px 7px;border-radius:6px;cursor:pointer;font-size:12px;display:flex;gap:6px;align-items:center}
.item:hover{background:var(--line)}
.item.sel{background:var(--subjbg);font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:var(--dim);flex:none}
.dot.done{background:var(--ok)}.dot.err{background:var(--err)}
.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px;
 padding-bottom:10px;border-bottom:1px solid var(--line)}
button{font:inherit;padding:4px 9px;border:1px solid var(--line);border-radius:6px;
 background:var(--bg);color:var(--fg);cursor:pointer}
button:hover{background:var(--line)}
button.p{background:var(--subj);color:#fff;border-color:var(--subj)}
button.sm{padding:1px 6px;font-size:11px}
pre#doc{white-space:pre-wrap;word-break:break-word;background:var(--panel);
 border:1px solid var(--line);border-radius:8px;padding:12px;font:inherit;margin:0}
.s-subject{background:var(--subjbg);border-bottom:2px solid var(--subj)}
.s-action{background:var(--actbg);border-bottom:2px solid var(--act)}
.s-condition{background:var(--condbg);border-bottom:2px solid var(--cond)}
.s-premise{background:var(--condbg);border-bottom:2px dotted var(--cond)}
.s-alias{background:var(--actbg);outline:1px solid var(--act);font-weight:600}
.outside{opacity:.45}
/* Huy hiệu vai — chỗ trước đây thiếu hẳn: 49 CU trong danh sách trông y hệt nhau
   dù 9 cái là meta-CU, và 45 premise thì không hiện ra ở đâu cả. */
.tag{font-size:9.5px;font-weight:700;padding:0 4px;border-radius:4px;flex:none;
 letter-spacing:.03em;border:1px solid transparent}
.t-actor_cu{background:var(--subjbg);color:var(--subj);border-color:var(--subj)}
.t-meta_cu{background:var(--actbg);color:var(--act);border-color:var(--act)}
.t-premise{background:var(--condbg);color:var(--cond);border-color:var(--cond)}
.filt{display:flex;gap:3px;flex-wrap:wrap;margin-bottom:8px}
.filt button{font-size:11px;padding:2px 6px}
.filt button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.gate{font-size:11.5px;border-left:3px solid var(--act);padding:5px 8px;margin:4px 0;
 background:var(--actbg);border-radius:0 5px 5px 0}
.gate code{font-size:10.5px;word-break:break-all}
.no{color:var(--err);font-weight:600}
.f{border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:8px;background:var(--bg)}
.f h3{margin:0 0 5px;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--dim)}
.q{font-size:12px;max-height:70px;overflow:auto;border-left:3px solid var(--line);padding-left:7px;margin:4px 0}
.meta{font-size:11px;color:var(--dim);font-family:ui-monospace,monospace}
label{font-size:12px;display:flex;gap:5px;align-items:center;margin:3px 0}
select,input[type=text],textarea{font:inherit;font-size:12px;padding:2px 5px;background:var(--bg);
 color:var(--fg);border:1px solid var(--line);border-radius:5px}
textarea{width:100%;min-height:44px}
.cond{border-top:1px dashed var(--line);padding-top:5px;margin-top:5px}
.warn{background:var(--errbg);border-left:3px solid var(--err);padding:6px 8px;border-radius:5px;
 font-size:11.5px;margin-bottom:8px}
.units{display:flex;flex-wrap:wrap;gap:3px;margin-top:6px}
.u{font-size:10.5px;padding:1px 5px;border:1px solid var(--line);border-radius:10px;cursor:pointer;
 background:var(--bg)}
.u:hover{background:var(--subjbg)}
.hint{font-size:11.5px;color:var(--dim);margin:6px 0}
#toast{position:fixed;bottom:14px;right:14px;background:var(--fg);color:var(--bg);padding:7px 13px;
 border-radius:7px;font-size:12.5px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.on{opacity:1}
</style>
</head>
<body>
<div id="app">
  <aside>
    <h1>Bộ nhãn <span id="prog" class="meta"></span></h1>
    <div class="filt" id="filt"></div>
    <div id="list"></div>
  </aside>
  <section>
    <div class="bar">
      <button onclick="go(-1)">◀</button><button onclick="go(1)">▶</button>
      <span id="who" class="meta"></span>
      <span style="flex:1"></span>
      <button class="p" onclick="save()">Lưu</button>
      <button onclick="dl()">Tải gold.jsonl</button>
      <label style="margin:0">Nhập<input type="file" id="imp" accept=".jsonl" style="display:none"></label>
      <button onclick="document.getElementById('imp').click()">Nhập JSONL</button>
    </div>
    <div class="hint" id="hint"></div>
    <div class="bar" id="tools" style="border:0;padding:0">
      <button onclick="assign('subject')">Gán Subject</button>
      <button onclick="assign('action')">Gán Action</button>
      <button onclick="addCond()">+ Điều kiện</button>
      <span id="sel" class="meta"></span>
    </div>
    <pre id="doc"></pre>
    <div class="units" id="units"></div>
  </section>
  <div id="side"></div>
</div>
<div id="toast"></div>
<script>
const DATA = {"fixtures": {"ND52-2024-dieu22.txt": {"text": "Điều 22. Các dịch vụ trung gian thanh toán và điều kiện cung ứng dịch vụ\n1. Dịch vụ trung gian thanh toán bao gồm: dịch vụ chuyển mạch tài chính, dịch vụ chuyển mạch tài chính quốc tế, dịch vụ bù trừ điện tử, dịch vụ ví điện tử, dịch vụ hỗ trợ thu hộ, chi hộ và dịch vụ cổng thanh toán điện tử. Hoạt động cung ứng dịch vụ trung gian thanh toán thực hiện theo quy định của Ngân hàng Nhà nước.\n2. Điều kiện cung ứng dịch vụ trung gian thanh toán:\nTổ chức không phải là ngân hàng, chi nhánh ngân hàng nước ngoài được Ngân hàng Nhà nước cấp Giấy phép hoạt động cung ứng dịch vụ trung gian thanh toán khi đáp ứng đầy đủ và phải đảm bảo duy trì đủ các điều kiện sau đây trong quá trình cung ứng dịch vụ trung gian thanh toán, cụ thể như sau:\na) Có giấy phép thành lập hoặc giấy chứng nhận đăng ký doanh nghiệp do cơ quan nhà nước có thẩm quyền cấp và không đang trong quá trình chia, tách, hợp nhất, sáp nhập, chuyển đổi, giải thể, phá sản theo quyết định đã được ban hành trong quá trình đề nghị cấp Giấy phép hoạt động cung ứng dịch vụ trung gian thanh toán; trường hợp cung ứng dịch vụ chuyển mạch tài chính, dịch vụ bù trừ điện tử, tổ chức phải đảm bảo không kinh doanh ngành nghề khác ngoài hoạt động cung ứng dịch vụ trung gian thanh toán;\nb) Có vốn điều lệ thực góp hoặc được cấp tối thiểu: 50 tỷ đồng đối với dịch vụ ví điện tử, dịch vụ hỗ trợ thu hộ, chi hộ và dịch vụ cổng thanh toán điện tử; 300 tỷ đồng đối với dịch vụ chuyển mạch tài chính, dịch vụ chuyển mạch tài chính quốc tế, dịch vụ bù trừ điện tử; chịu hoàn toàn trách nhiệm về tính hợp pháp của nguồn vốn đã góp hoặc vốn được cấp;\nc) Có Đề án cung ứng dịch vụ trung gian thanh toán được cấp có thẩm quyền theo quy định tại Điều lệ của tổ chức phê duyệt theo\nMẫu số 08 ban hành kèm theo Nghị định này;\nd) Điều kiện về nhân sự: Người đại diện theo pháp luật, Tổng Giám đốc (Giám đốc) của tổ chức phải có bằng đại học trở lên về một trong các ngành kinh tế, quản trị kinh doanh, luật, công nghệ thông tin và có ít nhất 05 năm kinh nghiệm là người quản lý, người điều hành của tổ chức trong lĩnh vực tài chính, ngân hàng và không thuộc những đối tượng bị cấm theo quy định của pháp luật; phải bảo đảm luôn có ít nhất một người đại diện theo pháp luật cư trú tại Việt Nam (Khi chỉ còn lại một người đại diện theo pháp luật cư trú tại Việt Nam thì người này khi xuất cảnh khỏi Việt Nam phải ủy quyền bằng văn bản cho cá nhân khác cư trú tại Việt Nam thực hiện quyền và nghĩa vụ của người đại diện theo pháp luật. Trường hợp này, người đại diện theo pháp luật vẫn phải chịu trách nhiệm về việc thực hiện quyền và nghĩa vụ đã ủy quyền).\nPhó Tổng Giám đốc (Phó Giám đốc) và các cán bộ chủ chốt thực hiện Đề án cung ứng dịch vụ trung gian thanh toán (gồm Trưởng phòng (ban) hoặc tương đương và các cán bộ kỹ thuật) có bằng cao đẳng trở lên về một trong các ngành kinh tế, quản trị kinh doanh, luật, công nghệ thông tin hoặc lĩnh vực chuyên môn đảm nhiệm;\nđ) Có Bản thuyết minh giải pháp kỹ thuật phục vụ cho hoạt động cung ứng dịch vụ trung gian thanh toán đề nghị cấp Giấy phép được cấp có thẩm quyền theo quy định tại Điều lệ của tổ chức phê duyệt đáp ứng yêu cầu đảm bảo an toàn hệ thống thông tin cấp độ 3 theo quy định của pháp luật;\ne) Đối với dịch vụ ví điện tử và dịch vụ hỗ trợ thu hộ, chi hộ cho các khách hàng có tài khoản tại nhiều ngân hàng, chi nhánh ngân hàng nước ngoài, tổ chức cung ứng dịch vụ phải được một tổ chức cung ứng dịch vụ chuyển mạch tài chính và dịch vụ bù trừ điện tử được Ngân hàng Nhà nước cấp phép để thực hiện chuyển mạch giao dịch tài chính và xử lý bù trừ các nghĩa vụ phát sinh trong quá trình cung ứng dịch vụ trung gian thanh toán của tổ chức;\ng) Đối với dịch vụ chuyển mạch tài chính, dịch vụ bù trừ điện tử, ngoài các điều kiện quy định tại điểm a, điểm b, điểm c, điểm d và điểm đ khoản 2 Điều này, tổ chức cung ứng dịch vụ phải: được một tổ chức thực hiện quyết toán kết quả bù trừ giữa các bên liên quan; có thỏa thuận kết nối với ít nhất 50 ngân hàng, chi nhánh ngân hàng nước ngoài có tổng vốn điều lệ trong năm liền kề trước năm nộp hồ sơ đề nghị cấp Giấy phép chiếm trên 65% tổng vốn điều lệ của các ngân hàng, chi nhánh ngân hàng nước ngoài trong hệ thống các tổ chức tín dụng và ít nhất 20 tổ chức cung ứng dịch vụ trung gian thanh toán; có cơ sở hạ tầng thông tin đáp ứng tối thiểu theo yêu cầu về bảo đảm an toàn hệ thống thông tin cấp độ 4 theo quy định của pháp luật, đảm bảo khả năng tích hợp, kết nối được với hệ thống kỹ thuật của tổ chức tham gia có thỏa thuận kết nối; có hệ thống máy chủ thực hiện theo quy định pháp luật và đáp ứng năng lực xử lý tối thiểu 10 triệu giao dịch thanh toán/ngày;\nTổ chức tham gia không được kết nối quá 02 tổ chức cung ứng dịch vụ chuyển mạch tài chính, dịch vụ bù trừ điện tử;\nh) Đối với dịch vụ chuyển mạch tài chính quốc tế, tổ chức cung ứng dịch vụ phải có Giấy phép hoạt động cung ứng dịch vụ trung gian thanh toán chuyển mạch tài chính còn hiệu lực; được một tổ chức thực hiện quyết toán kết quả bù trừ giữa các bên liên quan; có quy định nội bộ về tiêu chuẩn lựa chọn kết nối các hệ thống thanh toán quốc tế để thực hiện chuyển mạch tài chính các giao dịch thanh toán quốc tế; có quy định nội bộ về quy trình nghiệp vụ kỹ thuật đối với dịch vụ chuyển mạch tài chính quốc tế đề nghị cấp phép và tổ chức vận hành hệ thống thanh toán quốc tế kết nối với tổ chức cung ứng dịch vụ chuyển mạch tài chính quốc tế phải được thành lập và hoạt động hợp pháp ở nước ngoài.\n3. Trong thời hạn tối đa 06 tháng kể từ ngày được Ngân hàng Nhà nước cấp Giấy phép hoạt động cung ứng dịch vụ trung gian thanh toán, tổ chức được cấp phép phải cung ứng dịch vụ trung gian thanh toán ra thị trường và chỉ được phép cung ứng dịch vụ trung gian thanh toán ra thị trường sau khi triển khai hệ thống kỹ thuật đáp ứng quy định tại điểm đ khoản 2 Điều này, đáp ứng quy định tại điểm g, điểm h khoản 2 Điều này đối với dịch vụ chuyển mạch tài chính, dịch vụ bù trừ điện tử, dịch vụ chuyển mạch tài chính quốc tế.", "so_hieu": "52/2024/NĐ-CP"}, "ND52-2024-dieu23.txt": {"text": "Điều 23. Nguyên tắc lập và gửi hồ sơ đề nghị cấp, cấp lại, sửa đổi, bổ sung, thu hồi Giấy phép hoạt động cung ứng dịch vụ trung gian thanh toán\n1. Hồ sơ phải được lập bằng tiếng Việt. Trường hợp văn bản do cơ quan, tổ chức có thẩm quyền của nước ngoài cấp, công chứng hoặc chứng nhận phải được hợp pháp hóa lãnh sự theo quy định của pháp luật Việt Nam (trừ trường hợp được miễn hợp pháp hóa lãnh sự theo quy định pháp luật về hợp pháp hóa lãnh sự) và dịch ra tiếng Việt.\n2. Các bản sao hồ sơ, tài liệu phải là bản sao có chứng thực hoặc bản sao cấp từ sổ gốc hoặc bản sao kèm bản chính để đối chiếu theo quy định của pháp luật, trường hợp hồ sơ gửi trực tuyến thì thực hiện theo quy định về thủ tục hành chính trên môi trường điện tử.\n3. Sơ yếu lý lịch cá nhân tự lập được chứng thực chữ ký theo quy định của pháp luật.\n4. Hồ sơ được gửi qua đường bưu điện (dịch vụ bưu chính) hoặc nộp trực tiếp tới Bộ phận Một cửa Ngân hàng Nhà nước hoặc trực tuyến tại cổng dịch vụ công Ngân hàng Nhà nước hoặc cổng dịch vụ công quốc gia.\n5. Tổ chức đề nghị cấp, cấp lại, sửa đổi, bổ sung, thu hồi Giấy phép phải chịu hoàn toàn trách nhiệm trước pháp luật về tính chính xác, trung thực của các thông tin cung cấp.", "so_hieu": "52/2024/NĐ-CP"}, "ND52-2024-dieu26.txt": {"text": "Điều 26. Sửa đổi, bổ sung Giấy phép hoạt động cung ứng dịch vụ trung gian thanh toán\n1. Trường hợp thay đổi một trong các nội dung quy định trong Giấy phép hoạt động cung ứng dịch vụ trung gian thanh toán sau: tên tổ chức, địa điểm đặt trụ sở chính, ngừng cung cấp một hoặc một số dịch vụ trung gian thanh toán đã được cấp phép, kết nối thêm hệ thống thanh toán quốc tế của tổ chức cung ứng dịch vụ chuyển mạch tài chính quốc tế:\na) Tổ chức cung ứng dịch vụ trung gian thanh toán gửi 01 bộ hồ sơ đề nghị sửa đổi, bổ sung Giấy phép gồm: đơn đề nghị sửa đổi, bổ sung Giấy phép hoạt động cung ứng dịch vụ trung gian thanh toán theo\nMẫu số 12 ban hành kèm theo Nghị định này; bản sao Giấy phép hoạt động cung ứng dịch vụ trung gian thanh toán còn hiệu lực; bản sao giấy chứng nhận đăng ký doanh nghiệp đã thay đổi tên doanh nghiệp, giấy chứng nhận đăng ký đầu tư đối với nhà đầu tư nước ngoài (nếu có); báo cáo tình hình thực hiện hoạt động cung ứng dịch vụ trung gian thanh toán kể từ ngày được cấp Giấy phép đến ngày nộp hồ sơ đề nghị sửa đổi, bổ sung Giấy phép.\nTrường hợp đề nghị kết nối thêm hệ thống thanh toán quốc tế, tổ chức cung ứng dịch vụ chuyển mạch tài chính quốc tế bổ sung thêm các tài liệu quy định tại\nđiểm i khoản 2 Điều 24 Nghị định này;\nb) Ngân hàng Nhà nước tiếp nhận và xét tính hợp lệ của hồ sơ đề nghị sửa đổi, bổ sung Giấy phép trong thời hạn 05 ngày làm việc kể từ ngày nhận được hồ sơ và quyết định sửa đổi, bổ sung Giấy phép hoạt động cung ứng dịch vụ trung gian thanh toán trong thời hạn 30 ngày làm việc kể từ ngày nhận được đầy đủ hồ sơ hợp lệ. Trường hợp từ chối sửa đổi, bổ sung Giấy phép, Ngân hàng Nhà nước có văn bản trả lời tổ chức trong đó nêu rõ lý do;\nc) Thời hạn hoạt động ghi trên Giấy phép sửa đổi, bổ sung không vượt quá thời hạn hoạt động ghi trên Giấy phép hoạt động cung ứng dịch vụ trung gian thanh toán;\nd) Đối với dịch vụ trung gian thanh toán đề nghị ngừng cung cấp, tổ chức cung ứng dịch vụ trung gian thanh toán phải ngừng cung cấp dịch vụ sau khi Ngân hàng Nhà nước sửa đổi, bổ sung Giấy phép và trong thời hạn 30 ngày kể từ ngày được Ngân hàng Nhà nước sửa đổi, bổ sung Giấy phép, tổ chức cung ứng dịch vụ trung gian thanh toán phải gửi thông báo bằng văn bản tới các tổ chức và cá nhân liên quan để thanh lý hợp đồng và hoàn tất các nghĩa vụ, trách nhiệm giữa các bên liên quan theo quy định của pháp luật.\n2. Trường hợp thay đổi một trong các nội dung sau: người đại diện theo pháp luật, thay đổi vốn điều lệ, thay đổi tỷ lệ sở hữu vốn điều lệ của chủ sở hữu; thực hiện chia, tách, hợp nhất, sáp nhập, chuyển đổi doanh nghiệp, trong thời hạn hiệu lực của Giấy phép, tổ chức cung ứng dịch vụ trung gian thanh toán không phải làm thủ tục đề nghị sửa đổi, bổ sung Giấy phép nhưng phải gửi thông báo cho Ngân hàng Nhà nước bằng văn bản và tài liệu chứng minh các thông tin liên quan (nếu có) trong thời hạn 30 ngày kể từ ngày có các thay đổi nêu trên.", "so_hieu": "52/2024/NĐ-CP"}, "ND52-2024-dieu37.txt": {"text": "Điều  37. Hiệu lực thi hành\n1. Nghị định này có hiệu lực thi hành từ ngày 01 tháng 7 năm 2024.\n2. Nghị định này thay thế cho Nghị định số\n101/2012/NĐ-CP\nngày 22 tháng 11 năm 2012 của Chính phủ về thanh toán không dùng tiền mặt; Nghị định số\n80/2016/NĐ-CP\nngày 01 tháng 7 năm 2016 của Chính phủ sửa đổi, bổ sung một số điều của Nghị định số\n101/2012/NĐ-CP\nngày 22 tháng 11 năm 2012 của Chính phủ về thanh toán không dùng tiền mặt và bãi bỏ\nĐiều 3\ncủa Nghị định số\n16/2019/NĐ-CP\nngày 01 tháng 02 năm 2019 của Chính phủ sửa đổi, bổ sung một số điều của các Nghị định quy định về điều kiện kinh doanh thuộc phạm vi quản lý nhà nước của Ngân hàng Nhà nước.", "so_hieu": "52/2024/NĐ-CP"}, "TT17-2024-dieu11.txt": {"text": "Điều 11. Đối tượng mở tài khoản thanh toán\n1. Cá nhân mở tài khoản thanh toán tại ngân hàng, chi nhánh ngân hàng nước ngoài bao gồm:\na) Người từ đủ 15 tuổi trở lên không bị hạn chế hoặc mất năng lực hành vi dân sự theo quy định pháp luật Việt Nam;\nb) Người chưa đủ 15 tuổi, người bị hạn chế hoặc mất năng lực hành vi dân sự theo quy định của pháp luật Việt Nam mở tài khoản thanh toán thông qua người đại diện theo pháp luật;\nc) Người có khó khăn trong nhận thức, làm chủ hành vi theo quy định của pháp luật Việt Nam mở tài khoản thanh toán thông qua người giám hộ.\n2. Tổ chức được thành lập, hoạt động hợp pháp theo quy định của pháp luật Việt Nam bao gồm: tổ chức là pháp nhân (pháp nhân Việt Nam, pháp nhân nước ngoài), doanh nghiệp tư nhân, hộ kinh doanh và các tổ chức khác được mở tài khoản thanh toán tại ngân hàng, chi nhánh ngân hàng nước ngoài theo quy định của pháp luật.", "so_hieu": "17/2024/TT-NHNN"}, "TT17-2024-dieu16.txt": {"text": "Điều 16. Mở tài khoản thanh toán bằng phương tiện điện tử\n1. Ngân hàng, chi nhánh ngân hàng nước ngoài ban hành quy định nội bộ về quy trình, thủ tục mở tài khoản thanh toán bằng phương tiện điện tử phù hợp với quy định tại Thông tư này, pháp luật về phòng, chống rửa tiền, giao dịch điện tử, bảo vệ dữ liệu cá nhân, đảm bảo an toàn, bảo mật và bao gồm tối thiểu các bước như sau:\na) Thu thập các tài liệu, thông tin, dữ liệu để xác minh thông tin nhận biết khách hàng theo quy định tại khoản 2, 3 Điều 12 Thông tư này và:\n(i) Thông tin sinh trắc học của chủ tài khoản đối với khách hàng là cá nhân;\n(ii) Thông tin sinh trắc học của người đại diện hợp pháp đối với khách hàng là tổ chức;\nb) Kiểm tra tính hợp pháp, hợp lệ của các tài liệu, thông tin, dữ liệu xác minh thông tin nhận biết khách hàng và phải thực hiện đối chiếu khớp đúng thông tin sinh trắc học của chủ tài khoản thanh toán (đối với khách hàng là cá nhân), người đại diện hợp pháp (đối với khách hàng là tổ chức) với:\n(i) Dữ liệu sinh trắc học được lưu trong bộ phận lưu trữ thông tin được mã hóa của thẻ căn cước công dân hoặc thẻ căn cước đã được xác thực chính xác là do cơ quan Công an cấp hoặc thông qua xác thực tài khoản định danh điện tử của người đó do Hệ thống định danh và xác thực điện tử tạo lập; hoặc\n(ii) Dữ liệu sinh trắc học đã được thu thập và kiểm tra (đảm bảo sự khớp đúng giữa dữ liệu sinh trắc học của người đó với dữ liệu sinh trắc học trong bộ phận lưu trữ thông tin được mã hóa của thẻ căn cước công dân hoặc thẻ căn cước đã được xác thực chính xác là do cơ quan Công an cấp hoặc với dữ liệu sinh trắc học của người đó thông qua xác thực tài khoản định danh điện tử do Hệ thống định danh và xác thực điện tử tạo lập);\nc) Hiển thị cảnh báo cho khách hàng về các hành vi không được thực hiện khi mở và sử dụng tài khoản thanh toán bằng phương tiện điện tử và có giải pháp kỹ thuật xác nhận đảm bảo việc khách hàng đã đọc đầy đủ các nội dung cảnh báo;\nd) Cung cấp cho khách hàng nội dung thỏa thuận mở và sử dụng tài khoản thanh toán theo quy định tại Điều 13 Thông tư này và xác nhận sự chấp thuận của khách hàng đối với thỏa thuận mở và sử dụng tài khoản thanh toán theo quy định tại điểm b khoản 2 Điều này;\nđ) Thông báo cho khách hàng về số hiệu, tên tài khoản thanh toán, hạn mức giao dịch qua tài khoản thanh toán và ngày bắt đầu hoạt động của tài khoản thanh toán.\n2. Ngân hàng, chi nhánh ngân hàng nước ngoài tự quyết định biện pháp, hình thức, công nghệ phục vụ việc mở tài khoản thanh toán bằng phương tiện điện tử, tự chịu rủi ro phát sinh (nếu có) và phải đáp ứng tối thiểu các yêu cầu sau:\na) Biện pháp, hình thức, công nghệ được ngân hàng, chi nhánh ngân hàng nước ngoài lựa chọn phải đảm bảo tiêu chuẩn về an ninh, an toàn, bảo mật theo quy định của Ngân hàng Nhà nước;\nb) Xác nhận việc khách hàng chấp thuận với các nội dung tại thỏa thuận mở và sử dụng tài khoản thanh toán:\n(i) Đối với tài khoản thanh toán của cá nhân: có biện pháp kỹ thuật sử dụng hình thức xác nhận bằng phương tiện điện từ để thể hiện sự chấp thuận của chủ tài khoản đối với các nội dung tại thỏa thuận mở và sử dụng tài khoản thanh toán;\n(ii) Đối với tài khoản thanh toán của tổ chức: người đại diện hợp pháp ký chữ ký điện tử để khẳng định sự chấp thuận của chủ tài khoản đối với các nội dung tại thỏa thuận mở và sử dụng tài khoản thanh toán;\nc) Lưu trữ, bảo quản đầy đủ, chi tiết đối với các tài liệu, thông tin, dữ liệu nhận biết khách hàng trong quá trình mở, sử dụng tài khoản thanh toán bằng phương tiện điện tử, như: thông tin nhận biết khách hàng; các yếu tố sinh trắc học của chủ tài khoản thanh toán cá nhân, người đại diện hợp pháp của tổ chức mở tài khoản thanh toán; âm thanh, hình ảnh, bản ghi hình, ghi âm; số điện thoại đăng ký giao dịch trên phần mềm ứng dụng giao dịch ngân hàng trên internet, điện thoại di động; thông tin định danh duy nhất của thiết bị giao dịch (địa chỉ MAC); nhật ký giao dịch; kết quả đối chiếu thông tin sinh trắc học theo quy định tại điểm b khoản 1 Điều này. Các thông tin, dữ liệu phải được lưu trữ an toàn, bảo mật, được sao lưu dự phòng, đảm bảo tính đầy đủ, toàn vẹn của dữ liệu để phục vụ cho công tác kiểm tra, đối chiếu, xác thực chủ tài khoản trong quá trình sử dụng tài khoản thanh toán, giải quyết tra soát, khiếu nại, tranh chấp và cung cấp thông tin khi có yêu cầu từ cơ quan có thẩm quyền. Thời gian thực hiện theo quy định của pháp luật về phòng, chống rửa tiền và giao dịch điện tử;\nd) Ngân hàng, chi nhánh ngân hàng nước ngoài phải thường xuyên kiểm tra, đánh giá mức độ an toàn, bảo mật của biện pháp, hình thức, công nghệ và thực hiện tạm dừng cung cấp dịch vụ để nâng cấp, chỉnh sửa, hoàn thiện trong trường hợp có dấu hiệu mất an toàn.\n3. Việc mở tài khoản thanh toán bằng phương tiện điện tử không áp dụng đối với các trường hợp sau:\na) Tài khoản thanh toán chung;\nb) Tài khoản thanh toán bằng ngoại tệ;\nc) Khách hàng cá nhân theo quy định tại điểm b, c khoản 1 Điều 11 Thông tư này, khách hàng cá nhân là người từ đủ 15 tuổi đến chưa đủ 18 tuổi.", "so_hieu": "17/2024/TT-NHNN"}, "TT18-2024-dieu13.txt": {"text": "Điều 13. Hạn mức thẻ\n1. TCPHT thỏa thuận với chủ thẻ về hạn mức thanh toán, hạn mức chuyển khoản, hạn mức rút tiền mặt và các hạn mức khác trong việc sử dụng thẻ đối với chủ thẻ phù hợp với quy định tại Thông tư này, quy định của pháp luật hiện hành về quản lý ngoại hối và quy định pháp luật có liên quan.\n2. Đối với hạn mức rút ngoại tệ tiền mặt tại nước ngoài, một thẻ được rút số ngoại tệ tiền mặt tối đa tương đương 30 (ba mươi) triệu đồng Việt Nam trong một ngày.\n3. Đối với thẻ tín dụng, tổng hạn mức rút tiền mặt tính theo BIN của thẻ tín dụng tối đa là 100 (một trăm) triệu đồng Việt Nam trong 01 tháng.\n4. Đối với thẻ trả trước, TCPHT quy định cụ thể hạn mức số dư, hạn mức nạp thêm tiền vào thẻ và hạn mức giao dịch; đảm bảo số dư tại mọi thời điểm trên một thẻ trả trước vô danh không được quá 05 (năm) triệu đồng Việt Nam; tổng hạn mức giao dịch (bao gồm giao dịch rút tiền mặt, giao dịch chuyển khoản, giao dịch thanh toán tiền hàng hóa, dịch vụ) trên một thẻ trả trước định danh không được quá 100 (một trăm) triệu đồng Việt Nam trong 01 tháng.", "so_hieu": "18/2024/TT-NHNN"}, "TT18-2024-dieu9.txt": {"text": "Điều 9. Thủ tục phát hành thẻ\n1. Thỏa thuận về việc phát hành và sử dụng thẻ phải được lập thành hợp đồng phát hành và sử dụng thẻ phù hợp quy định tại Thông tư này và quy định pháp luật có liên quan. Nội dung của hợp đồng thực hiện theo quy định tại\nĐiều 12 Thông tư này.\n2. Trước khi giao kết hợp đồng phát hành và sử dụng thẻ theo yêu cầu của khách hàng, TCPHT yêu cầu chủ thẻ cung cấp đầy đủ các tài liệu, thông tin, dữ liệu nhằm nhận biết khách hàng theo quy định pháp luật về phòng, chống rửa tiền và quy định pháp luật có liên quan:\na) Trường hợp khách hàng cá nhân là người Việt Nam, TCPHT yêu cầu khách hàng cung cấp giấy tờ tùy thân để nhận biết khách hàng: Thẻ căn cước công dân hoặc thẻ căn cước hoặc Căn cước điện tử (thông qua việc truy cập vào tài khoản định danh điện tử mức độ 02) hoặc Chứng minh nhân dân;\nb) Trường hợp khách hàng cá nhân là người gốc Việt Nam chưa xác định được quốc tịch, TCPHT yêu cầu khách hàng cung cấp giấy tờ tùy thân để nhận biết khách hàng: Giấy chứng nhận căn cước;\nc) Trường hợp khách hàng cá nhân là người nước ngoài, TCPHT yêu cầu khách hàng cung cấp các giấy tờ tùy thân để nhận biết khách hàng: Hộ chiếu và thị thực nhập cảnh hoặc giấy tờ có giá trị thay thị thực hoặc giấy tờ chứng minh được miễn thị thực nhập cảnh; hoặc danh tính điện tử (thông qua việc truy cập vào tài khoản định danh điện tử mức độ 02) (nếu có). TCPHT yêu cầu khách hàng cung cấp giấy tờ cần thiết để xác minh thời hạn cư trú tại Việt Nam như giấy phép lao động hoặc các giấy tờ do cơ quan nhà nước có thẩm quyền cấp chứng minh thời hạn cư trú tại Việt Nam;\nd) Trường hợp khách hàng tổ chức, TCPHT yêu cầu khách hàng cung cấp thông tin, tài liệu, dữ liệu để nhận biết khách hàng theo quy định pháp luật về phòng, chống rửa tiền và quy định tại Điều này; bao gồm các tài liệu, thông tin, dữ liệu của người đại diện theo pháp luật của tổ chức hoặc đại diện theo ủy quyền của tổ chức khác (sau đây gọi tắt là đại diện hợp pháp).\nBổ sung\nBổ sung\n3. Việc thu thập, lưu trữ các tài liệu, thông tin, dữ liệu của khách hàng phải đáp ứng yêu cầu sau:\na) Các tài liệu là văn bản giấy phải là bản chính hoặc bản sao được chứng thực hoặc bản sao cấp từ sổ gốc hoặc bản sao kèm bản chính để đối chiếu phù hợp với quy định của pháp luật. Đối với trường hợp xuất trình bản chính để đối chiếu, TCPHT phải xác nhận vào bản sao và chịu trách nhiệm về tính chính xác của bản sao so với bản chính;\nb) Đối với các tài liệu, thông tin, dữ liệu là dữ liệu điện tử, TCPHT phải kiểm tra, đối chiếu, xác nhận đảm bảo nội dung đầy đủ, chính xác và lưu trữ theo quy định pháp luật về giao dịch điện tử;\nc) Trường hợp các tài liệu, thông tin, dữ liệu nêu tại điểm a, điểm b khoản này bằng tiếng nước ngoài, TCPHT được thỏa thuận với khách hàng về việc dịch hoặc không dịch ra tiếng Việt nhưng phải đảm bảo các nguyên tắc sau:\n(i) TCPHT phải kiểm tra, kiểm soát và chịu trách nhiệm xác nhận về nội dung của các tài liệu, thông tin, dữ liệu bằng tiếng nước ngoài đảm bảo đáp ứng các thông tin yêu cầu cung cấp tại Thông tư này;\n(ii) Các tài liệu, thông tin, dữ liệu bằng tiếng nước ngoài phải được dịch khi có yêu cầu của cơ quan có thẩm quyền;\nd) Các tài liệu, thông tin, dữ liệu theo quy định tại khoản 2 Điều này phải còn hiệu lực và thời hạn sử dụng trong suốt quá trình phát hành và sử dụng thẻ.\n4. Khi phát hành thẻ ghi nợ, TCPHT phải yêu cầu chủ thẻ chính có tài khoản thanh toán mở tại TCPHT.\n5. TCPHT phải quy định về thời hạn hiệu lực của thẻ, trong đó thời hạn hiệu lực đối với thẻ trả trước định danh không được quá 03 năm. Trước khi tiếp tục gia hạn thẻ cho khách hàng, TCPHT phải thực hiện các biện pháp xác thực, xác minh lại khách hàng theo quy định pháp luật về phòng, chống rửa tiền và quy định tại Thông tư này.\n6. Trong thời hạn ít nhất 15 ngày trước ngày dự kiến phát hành loại thẻ mới hoặc có thay đổi về mẫu thẻ đã phát hành, TCPHT gửi thông báo về mẫu thẻ phát hành cho Ngân hàng Nhà nước theo mẫu tại\nPhụ lục số 01 ban hành kèm theo Thông tư này. Trong thời hạn 15 ngày kể từ ngày ngừng phát hành thêm loại thẻ đã phát hành, TCPHT phải thông báo bằng văn bản cho Ngân hàng Nhà nước để theo dõi, quản lý.\n7. TCPHT căn cứ điều kiện, khả năng cung ứng của đơn vị mình để hướng dẫn về thủ tục phát hành thẻ cho khách hàng là người khuyết tật nhưng phải đảm bảo thu thập đủ tài liệu, thông tin, dữ liệu để xác minh thông tin nhận biết khách hàng theo quy định pháp luật về phòng, chống rửa tiền và Thông tư này.\n8. Trường hợp phát hiện khách hàng sử dụng tài liệu, thông tin, dữ liệu giả mạo, không hợp pháp hoặc khách hàng thuộc Danh sách đen theo quy định pháp luật về phòng, chống rửa tiền, TCPHT báo cáo cho cơ quan có thẩm quyền và xử lý theo quy định pháp luật.\n9. TCPHT có thể thực hiện phát hành thẻ ghi nợ, thẻ tín dụng, thẻ trả trước định danh đối với chủ thẻ chính là cá nhân, tổ chức bằng phương tiện điện tử. Thủ tục phát hành thẻ bằng phương tiện điện tử được thực hiện theo quy định tại Điều này và\nĐiều 10 Thông tư này.", "so_hieu": "18/2024/TT-NHNN"}, "TT40-2024-dieu25.txt": {"text": "Điều 25. Sử dụng dịch vụ ví điện tử\n1. Việc nạp tiền vào ví điện tử được thực hiện thông qua:\na) Nộp tiền mặt vào tài khoản đảm bảo thanh toán của tổ chức cung ứng dịch vụ trung gian thanh toán (cho dịch vụ ví điện tử) mở tại ngân hàng hợp tác;\nb) Nhận tiền từ tài khoản đồng Việt Nam của chủ ví điện tử tại ngân hàng liên kết;\nc) Nhận tiền từ tài khoản đồng Việt Nam mở tại ngân hàng, chi nhánh ngân hàng nước ngoài, trừ trường hợp quy định tại điểm b khoản này;\nd) Nhận tiền từ ví điện tử khác trong cùng hệ thống (do một tổ chức cung ứng dịch vụ ví điện tử mở);\nđ) Nhận tiền từ ví điện tử khác ngoài hệ thống (do tổ chức cung ứng dịch vụ ví điện tử khác mở).\n2. Chủ ví điện tử được sử dụng ví điện tử để:\na) Rút tiền ra khỏi ví điện tử về tài khoản đồng Việt Nam của chủ ví điện tử tại ngân hàng liên kết;\nb) Chuyển tiền đến tài khoản đồng Việt Nam mở tại ngân hàng, chi nhánh ngân hàng nước ngoài, trừ trường hợp quy định tại điểm a khoản này;\nc) Chuyển tiền đến ví điện tử khác trong cùng hệ thống (do một tổ chức cung ứng dịch vụ ví điện tử mở);\nd) Chuyển tiền đến ví điện tử khác ngoài hệ thống (do tổ chức cung ứng dịch vụ ví điện tử khác mở);\nđ) Thanh toán cho hàng hóa, dịch vụ; nộp phí, lệ phí cho các dịch vụ công hợp pháp theo quy định của pháp luật.\n3. Khách hàng không được sử dụng ví điện tử để thực hiện các giao dịch cho các mục đích rửa tiền, tài trợ khủng bố, tài trợ phổ biến vũ khí hủy diệt hàng loạt, lừa đảo, gian lận và các hành vi vi phạm pháp luật khác.\n4. Tổ chức cung ứng dịch vụ ví điện tử thực hiện hoàn trả tiền cho chủ ví điện tử trong các trường hợp:\na) Tổ chức cung ứng dịch vụ ví điện tử chấm dứt cung ứng dịch vụ ví điện tử cho khách hàng;\nb) Tổ chức cung ứng dịch vụ ví điện tử chấm dứt hoạt động, bị thu hồi Giấy phép, giải thể hoặc phá sản theo quy định của pháp luật;\nc) Chủ ví điện tử không thực hiện liên kết ví điện tử với tài khoản đồng Việt Nam hoặc thẻ ghi nợ của chính chủ ví điện tử theo quy định tại\nkhoản 4 Điều 24 Thông tư này;\nd) Chi trả thừa kế theo quy định của pháp luật khi chủ ví điện tử là cá nhân chết hoặc bị tuyên bố là đã chết;\nđ) Theo yêu cầu của cơ quan nhà nước có thẩm quyền theo quy định của pháp luật;\ne) Các trường hợp đóng ví điện tử và xử lý số dư còn lại khi đóng ví điện tử theo thỏa thuận bằng văn bản giữa chủ ví điện tử và tổ chức cung ứng dịch vụ ví điện tử theo quy định tại\nđiểm h khoản 1 Điều 19 Thông tư này.\n5. Tổ chức cung ứng dịch vụ ví điện tử không được nhận tiền mặt từ khách hàng để nạp tiền vào ví điện tử; không được phép cấp tín dụng cho khách hàng sử dụng ví điện tử, trả lãi trên số dư ví điện tử.\n6. Tổ chức cung ứng dịch vụ ví điện tử hướng dẫn khách hàng sử dụng ví điện tử đảm bảo nguyên tắc:\na) Phạm vi sử dụng và hạn mức giao dịch theo từng đối tượng khách hàng phù hợp với quy định về quản lý rủi ro, thỏa thuận mở và sử dụng ví điện tử theo quy định tại\nđiểm c khoản 1 Điều 28 Thông tư này;\nb) Có đủ thông tin cần thiết để kiểm tra, đối chiếu, xác minh thông tin nhận biết khách hàng trong quá trình sử dụng ví điện tử;\nc) Chỉ được sử dụng ví điện tử để thực hiện các giao dịch theo quy định tại\nkhoản 2 Điều 25 Thông tư này\nbằng phương tiện điện tử khi đã hoàn thành việc đối chiếu khớp đúng giấy tờ tùy thân và thông tin sinh trắc học của chủ ví điện tử hoặc người đại diện (đối với khách hàng cá nhân) hoặc người đại diện hợp pháp (đối với khách hàng tổ chức) với:\n(i) Dữ liệu sinh trắc học được lưu trong bộ phận lưu trữ thông tin được mã hóa của thẻ căn cước công dân hoặc thẻ căn cước của người đó đã được xác thực chính xác là do cơ quan Công an cấp hoặc thông qua xác thực tài khoản định danh điện tử của người đó do Hệ thống định danh và xác thực điện tử tạo lập; hoặc\n(ii) Dữ liệu sinh trắc học được thu thập thông qua gặp mặt trực tiếp người đó đối với trường hợp là người nước ngoài không sử dụng danh tính điện tử, người gốc Việt Nam chưa xác định được quốc tịch; hoặc\n(iii) Dữ liệu sinh trắc học đã được thu thập và kiểm tra (đảm bảo sự khớp đúng giữa dữ liệu sinh trắc học của người đó với dữ liệu sinh trắc học trong bộ phận lưu trữ thông tin được mã hóa của thẻ căn cước công dân hoặc thẻ căn cước đã được xác thực chính xác là do cơ quan Công an cấp hoặc với dữ liệu sinh trắc học của người đó thông qua xác thực tài khoản định danh điện tử do Hệ thống định danh và xác thực điện tử tạo lập); hoặc\n(iv) Dữ liệu sinh trắc học của người đó được lưu trong Cơ sở dữ liệu quốc gia về dân cư trong trường hợp sử dụng thẻ căn cước công dân không có bộ phận lưu trữ thông tin được mã hóa;\nd) Áp dụng các biện pháp xác thực đối với từng loại giao dịch trong thanh toán bằng phương tiện điện tử theo quy định của Ngân hàng Nhà nước.", "so_hieu": "40/2024/TT-NHNN"}, "TT40-2024-dieu26.txt": {"text": "Điều 26. Hạn mức giao dịch qua ví điện tử\n1. Tổng hạn mức giao dịch qua các ví điện tử cá nhân của 01 khách hàng tại 01 tổ chức cung ứng dịch vụ ví điện tử (bao gồm giao dịch chuyển tiền và thanh toán theo quy định tại\nđiểm b, điểm c, điểm d, điểm đ khoản 2 Điều 25 Thông tư này\n) tối đa là 100 (một trăm) triệu đồng Việt Nam trong một tháng.\n2. Quy định tại khoản 1 Điều này không áp dụng đối với:\na) Ví điện tử cá nhân của người có ký hợp đồng hoặc thỏa thuận làm đơn vị chấp nhận thanh toán với tổ chức cung ứng dịch vụ ví điện tử;\nb) Các giao dịch thanh toán: Thanh toán trực tuyến trên Cổng Dịch vụ công quốc gia; điện; nước; viễn thông; các loại phí, giá, tiền dịch vụ liên quan đến hoạt động giao thông của phương tiện giao thông đường bộ; học phí; viện phí; đóng bảo hiểm xã hội, bảo hiểm y tế phí bảo hiểm theo quy định tại\nLuật Kinh doanh bảo hiểm; chi trả các khoản nợ đến hạn, quá hạn, lãi và các chi phí phát sinh cho ngân hàng, chi nhánh ngân hàng nước ngoài.\n3. Tổ chức cung ứng dịch vụ ví điện tử phải quy định tổng hạn mức cho các giao dịch thanh toán quy định tại điểm b khoản 2 Điều này qua các ví điện tử cá nhân của 01 (một) khách hàng không lớn hơn tổng hạn mức giao dịch qua các ví điện tử cá nhân đã được tổ chức cung ứng dịch vụ ví điện tử cấp cho khách hàng đó theo quy định tại khoản 1 Điều này.\n4. Tổ chức cung ứng dịch vụ ví điện tử có trách nhiệm kiểm tra, giám sát và đảm bảo việc sử dụng ví điện tử cá nhân của khách hàng là phù hợp với hạn mức đã được tổ chức cung ứng dịch vụ ví điện tử cấp cho khách hàng đó. Tổ chức cung ứng dịch vụ ví điện tử phải chịu hoàn toàn trách nhiệm trong trường hợp khách hàng sử dụng ví điện tử không đúng hạn mức đã được tổ chức cung ứng dịch vụ ví điện tử cấp cho khách hàng theo quy định tại Thông tư này.", "so_hieu": "40/2024/TT-NHNN"}, "TT40-2024-dieu27.txt": {"text": "Điều 27. Sử dụng tài khoản đảm bảo thanh toán cho dịch vụ ví điện tử\n1. Tổ chức cung ứng dịch vụ ví điện tử phải đảm bảo duy trì tổng số dư trên tất cả các tài khoản đâm bảo thanh toán cho dịch vụ ví điện tử mở tại các ngân hàng hợp tác không thấp hơn tổng số dư tất cả các ví điện tử đã phát hành cho khách hàng tại cùng một thời điểm.\n2. Trường hợp đồng thời cung ứng dịch vụ ví điện tử và dịch vụ hỗ trợ thu hộ, chi hộ, tổ chức cung ứng dịch vụ trung gian thanh toán phải đảm bảo:\na) Tài khoản đảm bảo thanh toán cho dịch vụ ví điện tử không được sử dụng chung với tài khoản đảm bảo thanh toán cho dịch vụ hỗ trợ thu hộ, chi hộ và phải tách bạch với các tài khoản thanh toán khác tại ngân hàng hợp tác;\nb) Việc sử dụng (ghi nợ/ghi có) tài khoản đảm bảo thanh toán cho dịch vụ ví điện tử phải tách bạch với việc sử dụng (ghi nợ/ghi có) tài khoản đảm bảo thanh toán cho dịch vụ hỗ trợ thu hộ, chi hộ.\n3. Tài khoản đảm bảo thanh toán cho dịch vụ ví điện tử chỉ được sử dụng vào việc:\na) Chuyển tiền đến tài khoản đồng Việt Nam của chủ ví điện tử tại ngân hàng liên kết (cho việc sử dụng ví điện tử quy định tại\nđiểm a khoản 2 Điều 25 Thông tư này\n);\nb) Chuyển tiền đến tài khoản đồng Việt Nam tại ngân hàng, chi nhánh ngân hàng nước ngoài (cho việc sử dụng ví điện tử quy định tại\nđiểm b khoản 2 Điều 25 Thông tư này\n);\nc) Chuyển tiền đến tài khoản đảm bảo thanh toán cho dịch vụ ví điện tử của chính tổ chức cung ứng dịch vụ ví điện tử đó mở tại ngân hàng hợp tác;\nd) Chuyển tiền đến tài khoản đảm bảo thanh toán cho dịch vụ ví điện tử của tổ chức cung ứng dịch vụ ví điện tử khác;\nđ) Thanh toán vào tài khoản thanh toán của đơn vị chấp nhận thanh toán, đơn vị cung ứng dịch vụ công tương ứng với giao dịch sử dụng ví điện tử để thanh toán theo quy định tại\nđiểm đ khoản 2 Điều 25 Thông tư này;\ne) Hoàn trả tiền cho chủ ví điện tử trong trường hợp sử dụng ví điện tử theo quy định tại\nkhoản 4 Điều 25 Thông tư này.\ng) Tổ chức cung ứng dịch vụ ví điện tử được rút tiền phí mà các bên khấu trừ từ tài khoản đảm bảo thanh toán cho dịch vụ ví điện tử trong trường hợp các bên liên quan khấu trừ trực tiếp tiền phí dịch vụ trên ví điện tử. Tổ chức cung ứng dịch vụ ví điện tử thỏa thuận với ngân hàng hợp tác về biện pháp chứng minh, đảm bảo số tiền rút từ tài khoản đảm bảo thanh toán là số tiền phí được các bên khấu trừ trong giao dịch ví điện tử.", "so_hieu": "40/2024/TT-NHNN"}, "TT40-2024-dieu52.txt": {"text": "Điều 52. Hiệu lực thi hành\n1. Thông tư này có hiệu lực thi hành từ ngày 17 tháng 7 năm 2024, trừ trường hợp quy định tại khoản 2, khoản 3, khoản 4, khoản 5 Điều này.\n2. Quy định tại\nĐiều 11,\nĐiều 12,\nĐiều 13,\nĐiều 14,\nĐiều 35,\nkhoản 4 Điều 47 Thông tư này\ncó hiệu lực thi hành từ ngày 15 tháng 8 năm 2024.\n3. Quy định tại\nkhoản 2 Điều 17,\nĐiều 18,\nĐiều 19,\nĐiều 20,\nĐiều 21,\nĐiều 22,\nĐiều 23,\nĐiều 28 (trừ quy định tại khoản 3) Thông tư này\ncó hiệu lực thi hành từ ngày 01 tháng 10 năm 2024.\n4. Quy định tại\nđiểm c khoản 6 Điều 25,\nkhoản 3 Điều 28 Thông tư này\ncó hiệu lực thi hành từ ngày 01 tháng 01 năm 2025.\n5. Quy định tại\nđiểm c, điểm đ khoản 1, điểm b, điểm d khoản 2 Điều 25\nvà\nđiểm b, điểm d khoản 3 Điều 27 Thông tư này\ncó hiệu lực thi hành từ ngày 01 tháng 7 năm 2025.\n6. Thông tư số\n39/2014/TT-NHNN\nngày 11 tháng 12 năm 2014 của Thống đốc Ngân hàng Nhà nước Việt Nam hướng dẫn về dịch vụ trung gian thanh toán đã được sửa đổi, bổ sung một số điều tại\nĐiều 2\ncủa Thông tư số\n20/2016/TT-NHNN\nngày 30 tháng 6 năm 2016 của Thống đốc Ngân hàng Nhà nước Việt Nam sửa đổi, bổ sung một số điều của Thông tư số\n36/2012/TT-NHNN\nngày 28 tháng 12 năm 2012 quy định về trang bị, quản lý, vận hành và đảm bảo an toàn hoạt động của máy giao dịch tự động và Thông tư số\n39/2014/TT-NHNN\nngày 11 tháng 12 năm 2014 hướng dẫn về dịch vụ trung gian thanh toán;\nĐiều 3\ncủa Thông tư số\n30/2016/TT-NHNN\nngày 14 tháng 10 năm 2016 của Thống đốc Ngân hàng Nhà nước Việt Nam sửa đổi, bổ sung một số Thông tư quy định về hoạt động cung ứng dịch vụ thanh toán và dịch vụ trung gian thanh toán; Thông tư số\n23/2019/TT-NHNN\nngày 22 tháng 11 năm 2019 của Thống đốc Ngân hàng Nhà nước Việt Nam sửa đổi, bổ sung một số điều của Thông tư số\n39/2014/TT-NHNN\nngày 11 tháng 12 năm 2014 của Thống đốc Ngân hàng Nhà nước Việt Nam hướng dẫn về dịch vụ trung gian thanh toán hết hiệu lực kể từ ngày Thông tư này có hiệu lực thi hành; trừ các quy định sau đây:\na)\nĐiều 9a\nvà\nkhoản 4 Điều 11\nđã được sửa đổi, bổ sung theo Thông tư số\n23/2019/TT-NHNN\ncó hiệu lực thi hành đến hết ngày 14 tháng 8 năm 2024;\nb)\nKhoản 1, khoản 2, khoản 3, khoản 4, điểm a, điểm b khoản 7 Điều 9\nđã được sửa đổi, bổ sung theo Thông tư số\n23/2019/TT-NHNN\ncó hiệu lực thi hành đến hết ngày 30 tháng 9 năm 2024.", "so_hieu": "40/2024/TT-NHNN"}, "ND52-2024-dieu1.txt": {"text": "Điều 1. Phạm vi điều chỉnh\nNghị định này quy định về hoạt động thanh toán không dùng tiền mặt, bao gồm: mở và sử dụng tài khoản thanh toán; dịch vụ thanh toán không dùng tiền mặt; dịch vụ trung gian thanh toán; tổ chức, quản lý và giám sát các hệ thống thanh toán.", "so_hieu": "52/2024/NĐ-CP"}, "ND52-2024-dieu2.txt": {"text": "Điều 2. Đối tượng áp dụng\n1. Tổ chức cung ứng dịch vụ thanh toán không dùng tiền mặt.\n2. Tổ chức cung ứng dịch vụ trung gian thanh toán.\n3. Tổ chức, cá nhân có liên quan đến hoạt động cung ứng dịch vụ thanh toán không dùng tiền mặt, dịch vụ trung gian thanh toán.\n4. Tổ chức, cá nhân sử dụng dịch vụ thanh toán không dùng tiền mặt, dịch vụ trung gian thanh toán (sau đây gọi là khách hàng).", "so_hieu": "52/2024/NĐ-CP"}, "ND52-2024-dieu3.txt": {"text": "Điều 3. Giải thích từ ngữ\nTrong Nghị định này, các từ ngữ dưới đây được hiểu như sau:\n1. Dịch vụ thanh toán không dùng tiền mặt (sau đây gọi là dịch vụ thanh toán) bao gồm: dịch vụ thanh toán qua tài khoản thanh toán của khách hàng và dịch vụ thanh toán không qua tài khoản thanh toán của khách hàng.\n2. Dịch vụ thanh toán qua tài khoản thanh toán của khách hàng là việc cung ứng phương tiện thanh toán; thực hiện dịch vụ thanh toán séc, lệnh chi, ủy nhiệm chi, nhờ thu, ủy nhiệm thu, thẻ ngân hàng, chuyển tiền, thu hộ, chi hộ và các dịch vụ thanh toán khác cho khách hàng thông qua tài khoản thanh toán của khách hàng.\n3. Dịch vụ thanh toán không qua tài khoản thanh toán của khách hàng là việc cung ứng dịch vụ thanh toán, thực hiện giao dịch thanh toán không thông qua tài khoản thanh toán của khách hàng.\n4. Tổ chức cung ứng dịch vụ thanh toán không dùng tiền mặt (sau đây gọi là tổ chức cung ứng dịch vụ thanh toán) là tổ chức được cung ứng một hoặc một số dịch vụ thanh toán theo quy định tại Nghị định này, bao gồm: Ngân hàng Nhà nước Việt Nam (sau đây gọi là Ngân hàng Nhà nước), ngân hàng, chi nhánh ngân hàng nước ngoài, quỹ tín dụng nhân dân, tổ chức tài chính vi mô và doanh nghiệp cung ứng dịch vụ bưu chính công ích.\n5. Tổ chức cung ứng dịch vụ trung gian thanh toán là tổ chức không phải là ngân hàng, chi nhánh ngân hàng nước ngoài được Ngân hàng Nhà nước cấp Giấy phép hoạt động cung ứng dịch vụ trung gian thanh toán.\n6. Doanh nghiệp cung ứng dịch vụ bưu chính công ích là doanh nghiệp được chỉ định theo quy định của Luật Bưu chính.\n7. Giao dịch thanh toán không dùng tiền mặt (sau đây gọi là giao dịch thanh toán) là việc sử dụng dịch vụ thanh toán để thực hiện trả tiền hoặc chuyển tiền của tổ chức, cá nhân.\n8. Thanh toán quốc tế là giao dịch thanh toán được thực hiện cho một bên liên quan là tổ chức hoặc cá nhân có tài khoản thanh toán hoặc phương tiện thanh toán phát hành ở ngoài lãnh thổ Việt Nam.\n9. Chủ tài khoản thanh toán là cá nhân đứng tên mở tài khoản đối với tài khoản của cá nhân hoặc là tổ chức mở tài khoản đối với tài khoản của tổ chức.\n10. Phương tiện thanh toán không dùng tiền mặt (sau đây gọi là phương tiện thanh toán) là phương tiện do tổ chức cung ứng dịch vụ thanh toán, công ty tài chính được phép phát hành thẻ tín dụng, tổ chức cung ứng dịch vụ trung gian thanh toán cung ứng dịch vụ ví điện tử phát hành và được khách hàng sử dụng nhằm thực hiện giao dịch thanh toán, bao gồm: séc, lệnh chi, ủy nhiệm chi, nhờ thu, ủy nhiệm thu, thẻ ngân hàng (bao gồm: thẻ ghi nợ, thẻ tín dụng, thẻ trả trước), ví điện tử và các phương tiện thanh toán khác theo quy định của Ngân hàng Nhà nước.\n11. Phương tiện thanh toán không hợp pháp là các phương tiện thanh toán không thuộc quy định tại khoản 10 Điều này.\n12. Tiền điện tử là giá trị tiền Việt Nam đồng lưu trữ trên các phương tiện điện tử được cung ứng trên cơ sở đối ứng với số tiền được khách hàng trả trước cho ngân hàng, chi nhánh ngân hàng nước ngoài, tổ chức cung ứng dịch vụ trung gian thanh toán cung ứng dịch vụ ví điện tử.\n13. Dịch vụ chuyển mạch tài chính là dịch vụ cung ứng hạ tầng kỹ thuật kết nối, truyền dẫn và xử lý dữ liệu điện tử các giao dịch thanh toán trong nước giữa các tổ chức cung ứng dịch vụ thanh toán, công ty tài chính được phép phát hành thẻ tín dụng, tổ chức cung ứng dịch vụ trung gian thanh toán.\n14. Dịch vụ chuyển mạch tài chính quốc tế là việc kết nối với hệ thống thanh toán quốc tế để truyền dẫn và xử lý dữ liệu điện tử các giao dịch thanh toán quốc tế.\n15. Dịch vụ bù trừ điện tử là dịch vụ cung ứng hạ tầng kỹ thuật, nghiệp vụ để thực hiện việc tiếp nhận, đối chiếu dữ liệu thanh toán và tính toán kết quả số tiền phải thu, phải trả sau khi bù trừ giữa các bên thành viên tham gia để thực hiện việc quyết toán cho các bên có liên quan.\n16. Dịch vụ ví điện tử là dịch vụ do ngân hàng, chi nhánh ngân hàng nước ngoài, tổ chức cung ứng dịch vụ trung gian thanh toán cung ứng cho khách hàng để nạp tiền vào ví điện tử, rút tiền ra khỏi ví điện tử và thực hiện giao dịch thanh toán.\n17. Dịch vụ hỗ trợ thu hộ, chi hộ là việc tiếp nhận, xử lý dữ liệu điện tử, tính toán kết quả thu hộ, chi hộ, hủy việc thu hộ, chi hộ cho khách hàng có tài khoản thanh toán, thẻ ngân hàng và thực hiện thanh toán cho các bên có liên quan.\n18. Dịch vụ cổng thanh toán điện tử là dịch vụ cung ứng hạ tầng kỹ thuật để kết nối, truyền dẫn và xử lý dữ liệu điện tử các giao dịch thanh toán được thực hiện bằng phương tiện thanh toán giữa khách hàng, đơn vị chấp nhận thanh toán với ngân hàng, chi nhánh ngân hàng nước ngoài, công ty tài chính được phép phát hành thẻ tín dụng, tổ chức cung ứng dịch vụ trung gian thanh toán.\n19. Hệ thống thanh toán là hệ thống bao gồm các quy định, phương tiện, quy trình, thủ tục, cơ sở hạ tầng kỹ thuật để xử lý, chuyển mạch, bù trừ, quyết toán các giao dịch thanh toán.\n20. Hệ thống thanh toán quốc tế là hệ thống thanh toán được thành lập ở nước ngoài và cho phép thực hiện các giao dịch thanh toán quốc tế.\n21. Hệ thống thanh toán quan trọng là hệ thống thanh toán có vai trò chủ đạo trong việc phục vụ nhu cầu thanh toán của các chủ thể trong nền kinh tế, có khả năng phát sinh rủi ro hệ thống, đáp ứng ít nhất một trong các tiêu chí sau:\na) Là hệ thống thanh toán duy nhất hoặc chiếm tỷ trọng lớn so với tổng giá trị thanh toán của các hệ thống thanh toán cùng loại; hoặc\nb) Là hệ thống xử lý các giao dịch thanh toán giá trị cao; hoặc\nc) Là hệ thống được sử dụng để quyết toán cho các hệ thống thanh toán khác hoặc cho các giao dịch trên thị trường tài chính.\n22. Rủi ro hệ thống là rủi ro mà một thành viên tham gia hệ thống thanh toán không có khả năng thực hiện các nghĩa vụ tài chính trong hệ thống thanh toán khi đến hạn dẫn đến việc các thành viên tham gia khác cũng không thể thực hiện nghĩa vụ tài chính khi đến hạn, có lan truyền rủi ro đến các hệ thống thanh toán khác.\n23. Tài khoản thanh toán chung là tài khoản thanh toán có ít nhất hai chủ thể trở lên cùng đứng tên mở tài khoản.", "so_hieu": "52/2024/NĐ-CP"}, "TT40-2024-dieu1.txt": {"text": "Điều 1. Phạm vi điều chỉnh\nThông tư này quy định về hoạt động cung ứng dịch vụ trung gian thanh toán.", "so_hieu": "40/2024/TT-NHNN"}, "TT40-2024-dieu2.txt": {"text": "Điều 2. Đối tượng áp dụng\n1. Tổ chức cung ứng dịch vụ trung gian thanh toán.\n2. Ngân hàng, chi nhánh ngân hàng nước ngoài.\n3. Các tổ chức, cá nhân có liên quan trong hoạt động cung ứng dịch vụ trung gian thanh toán.", "so_hieu": "40/2024/TT-NHNN"}, "TT40-2024-dieu3.txt": {"text": "Điều 3. Giải thích từ ngữ\nTrong Thông tư này, các từ ngữ sau đây được hiểu như sau:\n1. Tài khoản đảm bảo thanh toán là tài khoản thanh toán bằng đồng Việt Nam (sau đây gọi là tài khoản đồng Việt Nam) của tổ chức cung ứng dịch vụ ví điện tử, tổ chức cung ứng dịch vụ hỗ trợ thu hộ, chi hộ mở tại ngân hàng hợp tác để đảm bảo cho việc cung ứng dịch vụ ví điện tử, dịch vụ hỗ trợ thu hộ, chi hộ.\n2. Tổ chức chủ trì Hệ thống bù trừ điện tử (sau đây gọi là tổ chức chủ trì bù trừ điện tử) là tổ chức cung ứng dịch vụ trung gian thanh toán được Ngân hàng Nhà nước Việt Nam (sau đây gọi là Ngân hàng Nhà nước) cấp phép cung ứng dịch vụ chuyển mạch tài chính, dịch vụ bù trừ điện tử và được tham gia, kết nối trực tiếp vào Hệ thống thanh toán điện tử liên ngân hàng Quốc gia (sau đây gọi là Hệ thống thanh toán điện tử liên ngân hàng) để thực hiện quyết toán bù trừ điện tử.\n3. Hệ thống bù trừ điện tử là hệ thống thanh toán do tổ chức chủ trì bù trừ điện tử xây dựng, sở hữu và tổ chức vận hành để cung ứng dịch vụ chuyển mạch tài chính và bù trừ điện tử.\n4. Thành viên của Hệ thống bù trừ điện tử (sau đây gọi là thành viên) là tổ chức cung ứng dịch vụ thanh toán, tổ chức cung ứng dịch vụ trung gian thanh toán và tổ chức khác đáp ứng các yêu cầu, tiêu chuẩn thành viên theo quy định của tổ chức chủ trì bù trừ điện tử và được kết nối với Hệ thống bù trừ điện tử để gửi, nhận và xử lý giao dịch thanh toán. Thành viên gồm thành viên quyết toán và thành viên không quyết toán.\n5. Thành viên quyết toán là thành viên có thiết lập hạn mức nợ ròng trong thanh toán bù trừ điện tử quy định tại\nĐiều 10 Thông tư này\nđể thực hiện giao dịch thanh toán qua Hệ thống bù trừ điện tử và mở tài khoản thanh toán tại Ngân hàng Nhà nước để quyết toán bù trừ điện tử.\n6. Thành viên không quyết toán là thành viên thực hiện các nghĩa vụ thanh toán, quyết toán trong giao dịch chuyển mạch tài chính và bù trừ điện tử thông qua thành viên quyết toán.\n7. Hạn mức nợ ròng trong thanh toán bù trừ điện tử (sau đây gọi là hạn mức bù trừ điện tử) là mức giới hạn giá trị thanh toán tối đa đối với khoản chênh lệch bù trừ phải trả của thành viên quyết toán trong phiên giao dịch bù trừ điện tử.\n8. Kết quả quyết toán ròng bù trừ điện tử (sau đây gọi là kết quả bù trừ điện tử) là bảng số liệu do tổ chức chủ trì bù trừ điện tử lập sau khi kết thúc mỗi phiên giao dịch bù trừ điện tử, phản ánh tổng hợp chênh lệch phải thu, phải trả cuối cùng của từng thành viên quyết toán trong phiên giao dịch đó.\n9. Quyết toán bù trừ điện tử là việc thực hiện thanh toán các khoản chênh lệch phải thu, phải trả theo kết quả quyết toán ròng thông qua tài khoản thanh toán của các thành viên quyết toán tại Ngân hàng Nhà nước. Tổ chức chủ trì bù trừ điện tử gửi Ngân hàng Nhà nước (qua Hệ thống thanh toán điện tử liên ngân hàng) kết quả bù trừ điện tử để thực hiện việc xử lý quyết toán bù trừ điện tử.\n10. Khả năng chi trả của thành viên quyết toán (sau đây gọi là khả năng chi trả) bao gồm toàn bộ số dư Có trên tài khoản thanh toán của thành viên quyết toán tại Ngân hàng Nhà nước tại thời điểm xử lý quyết toán bù trừ điện tử và hạn mức thấu chi được cấp để xử lý quyết toán bù trừ điện tử.\n11. Ngân hàng hợp tác là ngân hàng, chi nhánh ngân hàng nước ngoài có ký hợp đồng hoặc thỏa thuận với tổ chức cung ứng dịch vụ trung gian thanh toán về việc hợp tác cung ứng dịch vụ trung gian thanh toán theo quy định tại\nĐiều 8 Thông tư này.\n12. Ngân hàng liên kết là ngân hàng, chi nhánh ngân hàng nước ngoài nơi khách hàng sử dụng ví điện tử mở tài khoản đồng Việt Nam, thẻ ghi nợ và tài khoản đồng Việt Nam, thẻ ghi nợ này được khách hàng sử dụng để liên kết với ví điện tử của chính khách hàng.\n13. Giấy phép là Giấy phép hoạt động cung ứng dịch vụ trung gian thanh toán do Ngân hàng Nhà nước cấp cho tổ chức không phải là ngân hàng chi nhánh ngân hàng nước ngoài. Văn bản của Ngân hàng Nhà nước về sửa đổi, bổ sung Giấy phép là một bộ phận không tách rời của Giấy phép.", "so_hieu": "40/2024/TT-NHNN"}}, "items": [{"id": "52/2024/NĐ-CP#than/dieu_22#khoan_1", "kind": "cu", "fixture": "data/ aw_text": "7. Giao dịch thanh toán không dùng tiền mặt (sau đây gọi là giao dịch thanh toán) là việc sử dụng dịch vụ thanh toán để thực hiện trả tiền hoặc chuyển tiền của tổ chức, cá nhân.", "alias_span": [1613, 1633], "gop_vao_gate": null, "errors": [], "warnings": []}, "note": "", "type": "actor_cu", "fixture_name": "ND52-2024-dieu3.txt", "khoan": "7", "dieu_title": "Điều 3. Giải thích từ ngữ", "khoan_span": [1553, 1730], "diem": [], "units": [{"uid": 0, "kind": "tieu_de", "diem": null, "start": 0, "end": 25}, {"uid": 1, "kind": "chapeau", "diem": null, "start": 1553, "end": 1730}]}, {"id": "52/2024/NĐ-CP#than/dieu_3#khoan_8", "kind": "premise", "fixture": "data/fixtures/ND52-2024-dieu3.txt", "reviewed": false, "premise_kind": "dinh_nghia", "alias": null, "sai_loai": false, "raw_span": [1731, 1926], "_may_de_xuat": {"raw_text": "8. Thanh toán quốc tế là giao dịch thanh toán được thực hiện cho một bên liên quan là tổ chức hoặc cá nhân có tài khoản thanh toán hoặc phương tiện thanh toán phát hành ở ngoài lãnh thổ Việt Nam.", "alias_span": null, "gop_vao_gate": null, "errors": [], "warnings": []}, "note": "", "type": "actor_cu", "fixture_name": "ND52-2024-dieu3.txt", "khoan": "8", "dieu_title": "Điều 3. Giải thích từ ngữ", "khoan_span": [1731, 1926], "diem": [], "units": [{"uid": 0, "kind": "tieu_de", "diem": null, "start": 0, "end": 25}, {"uid": 1, "kind": "chapeau", "diem": null, "start": 1731, "end": 1926}]}, {"id": "52/2024/NĐ-CP#than/dieu_3#khoan_9", "kind": "premise", "fixture": "data/fixtures/ND52-2024-dieu3.txt", "reviewed": false, "premise_kind": "dinh_nghia", "alias": null, "sai_loai": false, "raw_span": [1927, 2077], "_may_de_xuat": {"raw_text": "9. Chủ tài khoản thanh toán là cá nhân đứng tên mở tài khoản đối với tài khoản của cá nhân hoặc là tổ chức mở tài khoản đối với tài khoản của tổ chức.", "alias_span": null, "gop_vao_gate": null, "errors": [], "warnings": []}, "note": "", "type": "actor_cu", "fixture_name": "ND52-2024-dieu3.txt", "khoan": "9", "dieu_title": "Điều 3. Giải thích từ ngữ", "khoan_span": [1927, 2077], "diem": [], "units": [{"uid": 0, "kind": "tieu_de", "diem": null, "start": 0, "end": 25}, {"uid": 1, "kind": "chapeau", "diem": null, "start": 1927, "end": 2077}]}, {"id": "52/2024/NĐ-CP#than/dieu_3#khoan_10", "kind": "premise", "fixture": "data/fixtures/ND52-2024-dieu3.txt", "reviewed": false, "premise_kind": "dinh_nghia", "alias": "phương tiện thanh toán", "sai_loai": false, "raw_span": [2078, 2631], "_may_de_xuat": {"raw_text": "10. Phương tiện thanh toán không dùng tiền mặt (sau đây gọi là phương tiện thanh toán) là phương tiện do tổ chức cung ứng dịch vụ thanh toán, công ty tài chính được phép phát hành thẻ tín dụng, tổ chứ", "alias_span": [2141, 2163], "gop_vao_gate": null, "errors": [], "warnings": []}, "note": "", "type": "actor_cu", "fixture_name": "ND52-2024-dieu3.txt", "khoan": "10", "dieu_title": "Điều 3. Giải thích từ ngữ", "khoan_span": [2078, 2631], "diem": [], "units": [{"uid": 0, "kind": "tieu_de", "diem": null, "start": 0, "end": 25}, {"uid": 1, "kind": "chapeau", "diem": null, "start": 2078, "end": 2631}]}, {"id": "52/2024/NĐ-CP#than/dieu_3#khoan_11", "kind": "premise", "fixture": "data/fixtures/ND52-2024-dieu3.txt", "reviewed": false, "premise_kind": "dinh_nghia", "alias": null, "sai_loai": false, "raw_span": [2632, 2747], "_may_de_xuat": {"raw_text": "11. Phương tiện thanh toán không hợp pháp là các phương tiện thanh toán không thuộc quy định tại khoản 10 Điều này.", "alias_span": null, "gop_vao_gate": null, "errors": [], "warnings": []}, "note": "", "type": "actor_cu", "fixture_name": "ND52-2024-dieu3.txt", "khoan": "11", "dieu_title": "Điều 3. Giải thích từ ngữ", "khoan_span": [2632, 2747], "diem": [], "units": [{"uid": 0, "kind": "tieu_de", "diem": null, "start": 0, "end": 25}, {"uid": 1, "kind": "chapeau", "diem": null, "start": 2632, "end": 2747}]}, {"id": "52/2024/NĐ-CP#than/dieu_3#khoan_12", "kind": "premise", "fixture": "data/fixtures/ND52-2024-dieu3.txt", "reviewed": false, "premise_kind": "dinh_nghia", "alias": null, "sai_loai": false, "raw_span": [2748, 3025], "_may_de_xuat": {"raw_text": "12. Tiền điện tử là giá trị tiền Việt Nam đồng lưu trữ trên các phương tiện điện tử được cung ứng trên cơ sở đối ứng với số tiền được khách hàng trả trước cho ngân hàng, chi nhánh ngân hàng nước ngoài", "alias_span": null, "gop_vao_gate": null, "errors": [], "warnings": []}, "note": "", "type": "actor_cu", "fixture_name": "ND52-2024-dieu3.txt", "khoan": "12", "dieu_title": "Điều 3. Giải thích từ ngữ", "khoan_span": [2748, 3025], "diem": [], "units": [{"uid": 0, "kind": "tieu_de", "diem": null, "start": 0, "end": 25}, {"uid": 1, "kind": "chapeau", "diem": null, "start": 2748, "end": 3025}]}, {"id": "52/2024/NĐ-CP#than/dieu_3#khoan_13", "kind": "premise", "fixture": "data/fixtures/ND52-2024-dieu3.txt", "reviewed": false, "premise_kind": "dinh_nghia", "alias": null, "sai_loai": false, "raw_span": [3026, 3323], "_may_de_xuat": {"raw_text": "13. Dịch vụ chuyển mạch tài chính là dịch vụ cung ứng hạ tầng kỹ thuật kết nối, truyền dẫn và xử lý dữ liệu điện tử các giao dịch thanh toán trong nước giữa các tổ chức cung ứng dịch vụ thanh toán, cô", "alias_span": null, "gop_vao_gate": null, "errors": [], "warnings": []}, "note": "", "type": "actor_cu", "fixture_name": "ND52-2024-dieu3.txt", "khoan": "13", "dieu_title": "Điều 3. Giải thích từ ngữ", "khoan_span": [3026, 3323], "diem": [], "units": [{"uid": 0, "kind": "tieu_de", "diem": null, "start": 0, "end": 25}, {"uid": 1, "kind": "chapeau", "diem": null, "start": 3026, "end": 3323}]}, {"id": "52/2024/NĐ-CP#than/dieu_3#khoan_14", "kind": "premise", "fixture": "data/fixtures/ND52-2024-dieu3.txt", "reviewed": false, "premise_kind": "dinh_nghia", "alias": null, "sai_loai": false, "raw_span": [3324, 3486], "_may_de_xuat": {"raw_text": "14. Dịch vụ chuyển mạch tài chính quốc tế là việc kết nối với hệ thống thanh toán quốc tế để truyền dẫn và xử lý dữ liệu điện tử các giao dịch thanh toán quốc tế.", "alias_span": null, "gop_vao_gate": null, "errors": [], "warnings": []}, "note": "", "type": "actor_cu", "fixture_name": "ND52-2024-dieu3.txt", "khoan": "14", "dieu_title": "Điều 3. Giải thích từ ngữ", "khoan_span": [3324, 3486], "diem": [], "units": [{"uid": 0, "kind": "tieu_de", "diem": null, "start": 0, "end": 25}, {"uid": 1, "kind": "chapeau", "diem": null, "start": 3324, "end": 3486}]}, {"id": "52/2024/NĐ-CP#than/dieu_3#khoan_15", "kind": "premise", "fixture": "data/fixtures/ND52-2024-dieu3.txt", "reviewed": false, "premise_kind": "dinh_nghia", "alias": null, "sai_loai": false, "raw_span": [3487, 3770], "_may_de_xuat": {"raw_text": "15. Dịch vụ bù trừ điện tử là dịch vụ cung ứng hạ tầng kỹ thuật, nghiệp vụ để thực hiện việc tiếp nhận, đối chiếu dữ liệu thanh toán và tính toán kết quả số tiền phải thu, phải trả sau khi bù trừ giữa", "alias_span": null, "gop_vao_gate": null, "errors": [], "warnings": []}, "note": "", "type": "actor_cu", "fixture_name": "ND52-2024-dieu3.txt", "khoan": "15", "dieu_title": "Điều 3. Giải thích từ ngữ", "khoan_span": [3487, 3770], "diem": [], "units": [{"uid": 0, "kind": "tieu_de", "diem": null, "start": 0, "end": 25}, {"uid": 1, "kind": "chapeau", "diem": null, "start": 3487, "end": 3770}]}, {"id": "52/2024/NĐ-CP#than/dieu_3#khoan_16", "kind": "premise", "fixture": "data/fixtures/ND52-2024-dieu3.txt", "reviewed": false, "premise_kind": "dinh_nghia", "alias": null, "sai_loai": false, "raw_span": [3771, 4012], "_may_de_xuat": {"raw_text": "16. Dịch vụ ví điện tử là dịch vụ do ngân hàng, chi nhánh ngân hàng nước ngoài, tổ chức cung ứng dịch vụ trung gian thanh toán cung ứng cho khách hàng để nạp tiền vào ví điện tử, rút tiền ra khỏi ví đ", "alias_span": null, "gop_vao_gate": null, "errors": [], "warnings": []}, "note": "", "type": "actor_cu", "fixture_name": "ND52-2024-dieu3.txt", "khoan": "16", "dieu_title": "Điều 3. Giải thích từ ngữ", "khoan_span": [3771, 4012], "diem": [], "units": [{"uid": 0, "kind": "tieu_de", "diem": null, "start": 0, "end": 25}, {"uid": 1, "kind": "chapeau", "diem": null, "start": 3771, "end": 4012}]}, {"id": "52/2024/NĐ-CP#than/dieu_3#khoan_17", "kind": "premise", "fixture": "data/fixtures/ND52-2024-dieu3.txt", "reviewed": false, "premise_kind": "dinh_nghia", "alias": null, "sai_loai": false, "raw_span": [4013, 4250], "_may_de_xuat": {"raw_text": "17. Dịch vụ hỗ trợ thu hộ, chi hộ là việc tiếp nhận, xử lý dữ liệu điện tử, tính toán kết quả thu hộ, chi hộ, hủy việc thu hộ, chi hộ cho khách hàng có tài khoản thanh toán, thẻ ngân hàng và thực hiện", "alias_span": null, "gop_vao_gate": null, "errors": [], "warnings": []}, "note": "", "type": "actor_cu", "fixture_name": "ND52-2024-dieu3.txt", "khoan": "17", "dieu_title": "Điều 3. Giải thích từ ngữ", "khoan_span": [4013, 4250], "diem": [], "units": [{"uid": 0, "kind": "tieu_de", "diem": null, "start": 0, "end": 25}, {"uid": 1, "kind": "chapeau", "diem": null, "start": 4013, "end": 4250}]}, {"id": "52/2024/NĐ-CP#than/dieu_3#khoan_18", "kind": "premise", "fixture": "data/fixtures/ND52-2024-dieu3.txt", "reviewed": false, "premise_kind": "dinh_nghia", "alias": null, "sai_loai": false, "raw_span": [4251, 4631], "_may_de_xuat": {"raw_text": "18. Dịch vụ cổng thanh toán điện tử là dịch vụ cung ứng hạ tầng kỹ thuật để kết nối, truyền dẫn và xử lý dữ liệu điện tử các giao dịch thanh toán được thực hiện bằng phương tiện thanh toán giữa khách ", "alias_span": null, "gop_vao_gate": null, "errors": [], "warnings": []}, "note": "", "type": "actor_cu", "fixture_name": "ND52-2024-dieu3.txt", "khoan": "18", "dieu_title": "Điều 3. Giải thích từ ngữ", "khoan_span": [4251, 4631], "diem": [], "units": [{"uid": 0, "kind": "tieu_de", "diem": null, "start": 0, "end": 25}, {"uid": 1, "kind": "chapeau", "diem": null, "start": 4251, "end": 4631}]}, {"id": "52/2024/NĐ-CP#than/dieu_3#khoan_19", "kind": "premise", "fixture": "data/fixtures/ND52-2024-dieu3.txt", "reviewed": false, "premise_kind": "dinh_nghia", "alias": null, "sai_loai": false, "raw_span": [4632, 4813], "_may_de_xuat": {"raw_text": "19. Hệ thống thanh toán là hệ thống bao gồm các quy định, phương tiện, quy trình, thủ tục, cơ sở hạ tầng kỹ thuật để xử lý, chuyển mạch, bù trừ, quyết toán các giao dịch thanh toán.", "alias_span": null, "gop_vao_gate": null, "errors": [], "warnings": []}, "note": "", "type": "actor_cu", "fixture_name": "ND52-2024-dieu3.txt", "khoan": "19", "dieu_title": "Điều 3. Giải thích từ ngữ", "khoan_span": [4632, 4813], "diem": [], "units": [{"uid": 0, "kind": "tieu_de", "diem": null, "start": 0, "end": 25}, {"uid": 1, "kind": "chapeau", "diem": null, "start": 4632, "end": 4813}]}, {"id": "52/2024/NĐ-CP#than/dieu_3#khoan_20", "kind": "premise", "fixture": "data/fixtures/ND52-2024-dieu3.txt", "reviewed": false, "premise_kind": "dinh_nghia", "alias": null, "sai_loai": false, "raw_span": [4814, 4952], "_may_de_xuat": {"raw_text": "20. Hệ thống thanh toán quốc tế là hệ thống thanh toán được thành lập ở nước ngoài và cho phép thực hiện các giao dịch thanh toán quốc tế.", "alias_span": null, "gop_vao_gate": null, "errors": [], "warnings": []}, "note": "", "type": "actor_cu", "fixture_name": "ND52-2024-dieu3.txt", "khoan": "20", "dieu_title": "Điều 3. Giải thích từ ngữ", "khoan_span": [4814, 4952], "diem": [], "units": [{"uid": 0, "kind": "tieu_de", "diem": null, "start": 0, "end": 25}, {"uid": 1, "kind": "chapeau", "diem": null, "start": 4814, "end": 4952}]}, {"id": "52/2024/NĐ-CP#than/dieu_3#khoan_21", "kind": "premise", "fixture": "data/fixtures/ND52-2024-dieu3.txt", "reviewed": false, "premise_kind": "dinh_nghia", "alias": null, "sai_loai": false, "raw_span": [4953, 5508], "_may_de_xuat": {"raw_text": "21. Hệ thống thanh toán quan trọng là hệ thống thanh toán có vai trò chủ đạo trong việc phục vụ nhu cầu thanh toán của các chủ thể trong nền kinh tế, có khả năng phát sinh rủi ro hệ thống, đáp ứng ít ", "alias_span": null, "gop_vao_gate": null, "errors": [], "warnings": []}, "note": "", "type": "actor_cu", "fixture_name": "ND52-2024-dieu3.txt", "khoan"
