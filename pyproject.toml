[project]
name = "lexflow"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "arq>=0.26",
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.139.2",
    "google-genai>=2.12.1",
    "lancedb>=0.34.0",
    "neo4j>=6.2.0",
    "pyarrow>=25.0.0",
    "pydantic-settings>=2.14.2",
    "pyjwt[crypto]>=2.13.0",
    "pypdf>=6.14.2",
    "python-dotenv>=1.2.2",
    "tantivy>=0.26.0",
    "tenacity>=9.1.4",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.22",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
